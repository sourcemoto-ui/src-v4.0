            const [showCalculator, setShowCalculator] = useState(false);

            const [denoms, setDenoms] = useState({ 1000: '', 500: '', 100: '', 50: '', 10: '', 5: '', 1: '' });

            const [manualActualCash, setManualActualCash] = useState('');

            const [note, setNote] = useState('');

            const [isClosed, setIsClosed] = useState(false);



            const { cashFromOrders, transferTotal } = useMemo(() => {

                let cash = 0;

                let trans = 0;

                records.forEach(r => {

                    const rDate = getLocalDateString(parseDateSafe(r.timestamp || r.date));

                    if (rDate === targetDate && r.status === 'completed') {

                        if (r.paymentMethod === '現金') cash += cleanNumber(r.total, 0);

                        else if (r.paymentMethod === '匯款') trans += cleanNumber(r.total, 0);

                    }

                });

                return { cashFromOrders: cash, transferTotal: trans };

            }, [records, targetDate]);


            useEffect(() => {

                const existing = (cashRecords || []).find(c => c.date === targetDate);

                if (existing) {

                    setStartingCash(existing.startingCash !== undefined ? existing.startingCash : '');

                    setIncomes(Array.isArray(existing.incomes) ? existing.incomes : []);

                    setExpenses(Array.isArray(existing.expenses) ? existing.expenses : []);

                    setDenoms(existing.denoms || { 1000: '', 500: '', 100: '', 50: '', 10: '', 5: '', 1: '' });

                    setManualActualCash(existing.actual !== undefined ? existing.actual : '');

                    setNote(existing.note || '');

                    setIsClosed(Boolean(existing.isClosed));

                } else {

                    setStartingCash('');

                    setIncomes([]);

                    setExpenses([]);

                    setDenoms({ 1000: '', 500: '', 100: '', 50: '', 10: '', 5: '', 1: '' });

                    setManualActualCash('');

                    setNote('');

                    setIsClosed(false);

                }

            }, [targetDate, cashRecords]);



            const totalExtraIncome = incomes.reduce((s, i) => s + cleanNumber(i.amount, 0), 0);

            const totalExpense = expenses.reduce((s, e) => s + cleanNumber(e.amount, 0), 0);

            const expectedCash = cleanNumber(startingCash, 0) + cashFromOrders + totalExtraIncome - totalExpense;



            const denomTotal = Object.entries(denoms).reduce((sum, [d, count]) => sum + (Number(d) * cleanNumber(count, 0)), 0);

            const actualCash = showCalculator ? denomTotal : cleanNumber(manualActualCash, 0);

            const cashDiff = actualCash - expectedCash;



            const handleAddIncome = () => {

                if (!incDesc || !incAmount) return showAlert('請輸入收入說明與金額');

                setIncomes([...incomes, { id: Date.now(), desc: incDesc, amount: cleanNumber(incAmount, 0) }]);

                setIncDesc(''); setIncAmount('');

            };



            const handleAddExpense = () => {

                if (!expDesc || !expAmount) return showAlert('請輸入支出說明與金額');

                setExpenses([...expenses, { id: Date.now(), desc: expDesc, amount: cleanNumber(expAmount, 0) }]);

                setExpDesc(''); setExpAmount('');

            };



            const handleSaveCashRecord = (closeFlag = false) => {

                const newRec = {

                    date: targetDate,

                    startingCash: cleanNumber(startingCash, 0),

                    cashFromOrders,

                    incomes,

                    expenses,

                    expected: expectedCash,

                    actual: actualCash,

                    diff: cashDiff,

                    transfer: transferTotal,

                    denoms,

                    note,

                    isClosed: closeFlag

                };

                const others = (cashRecords || []).filter(c => c.date !== targetDate);

                const updated = [newRec, ...others].sort((a, b) => b.date.localeCompare(a.date));

                setCashRecords(updated);

                setIsClosed(closeFlag);

                if (saveSettingsToCloud) saveSettingsToCloud(updated, true);

                showAlert(closeFlag ? `✅ 【${targetDate}】帳務已確認關帳鎖定並同步雲端！` : `💾 【${targetDate}】對帳草稿已儲存！`);

            };



            return (

                <div className="max-w-5xl mx-auto space-y-4 pb-24 text-xs">

                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">

                        <div>

                            <h2 className="text-lg font-black text-slate-800 flex items-center gap-2">

                                <Wallet className="text-blue-600" size={22}/> 每日公庫帳務與現金盤點對帳

                            </h2>

                            <p className="text-slate-400 text-xs mt-0.5">自動彙整當日完工現金工單，支援零用金收支紀錄與下班點鈔核對</p>

                        </div>

                        <div className="flex items-center gap-2">

                            <input 

                                type="date" 

                                value={targetDate} 

                                onChange={e => setTargetDate(e.target.value)} 

                                className="p-2 border border-slate-300 rounded-xl font-bold bg-slate-50 outline-none focus:border-blue-500"

                            />

                            {isClosed && (

                                <span className="px-3 py-1.5 bg-emerald-100 text-emerald-800 rounded-xl font-black flex items-center gap-1">

                                    <Lock size={13}/> 已關帳

                                </span>

                            )}

                        </div>

                    </div>



                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">

                        <div className="bg-white p-3.5 rounded-2xl border border-slate-200">

                            <span className="text-slate-400 font-bold block">① 開帳找零準備金</span>

                            <input 

                                type="number" 

                                disabled={isClosed}

                                value={startingCash} 

                                onChange={e => setStartingCash(e.target.value)} 

                                placeholder="$ 0" 

                                className="w-full mt-1 p-1.5 border border-slate-300 rounded-lg font-mono font-black text-sm outline-none"

                            />

                        </div>

                        <div className="bg-white p-3.5 rounded-2xl border border-slate-200">

                            <span className="text-slate-400 font-bold block">② 當日工單現金收入</span>

                            <div className="text-xl font-black text-blue-600 font-mono mt-1.5">${cashFromOrders.toLocaleString()}</div>

                            <span className="text-[10px] text-slate-400">匯款入帳: ${transferTotal.toLocaleString()}</span>

                        </div>

                        <div className="bg-white p-3.5 rounded-2xl border border-slate-200">

                            <span className="text-slate-400 font-bold block">③ 系統應有公庫現金</span>

                            <div className="text-xl font-black text-slate-900 font-mono mt-1.5">${expectedCash.toLocaleString()}</div>

                            <span className="text-[10px] text-slate-400">準備金+工單+收入-支出</span>

                        </div>

                        <div className={`p-3.5 rounded-2xl border ${cashDiff === 0 ? 'bg-emerald-50 border-emerald-200' : cashDiff > 0 ? 'bg-blue-50 border-blue-200' : 'bg-red-50 border-red-200'}`}>

                            <span className="text-slate-600 font-bold block">④ 盤點短溢差額</span>

                            <div className={`text-xl font-black font-mono mt-1.5 ${cashDiff === 0 ? 'text-emerald-600' : cashDiff > 0 ? 'text-blue-600' : 'text-red-600'}`}>

                                {cashDiff > 0 ? `+${cashDiff.toLocaleString()}` : cashDiff.toLocaleString()}

                            </div>

                            <span className="text-[10px] text-slate-500">{cashDiff === 0 ? '✓ 帳實完全相符' : cashDiff > 0 ? '溢收' : '短少'}</span>

                        </div>

                    </div>



                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                        <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">

                            <h3 className="font-bold text-slate-800 text-sm">手工額外現金收入 / 零用金支出</h3>

                            {!isClosed && (

                                <div className="space-y-2">

                                    <div className="flex gap-1.5">

                                        <input type="text" placeholder="額外收入說明 (如: 廢鐵回收)" value={incDesc} onChange={e => setIncDesc(e.target.value)} className="flex-1 p-2 border border-slate-300 rounded-lg"/>

                                        <input type="number" placeholder="金額" value={incAmount} onChange={e => setIncAmount(e.target.value)} className="w-24 p-2 border border-slate-300 rounded-lg font-mono"/>

                                        <button type="button" onClick={handleAddIncome} className="px-3 bg-emerald-600 text-white rounded-lg font-bold">+收入</button>

                                    </div>

                                    <div className="flex gap-1.5">

                                        <input type="text" placeholder="公庫支出說明 (如: 買便當、五金)" value={expDesc} onChange={e => setExpDesc(e.target.value)} className="flex-1 p-2 border border-slate-300 rounded-lg"/>

                                        <input type="number" placeholder="金額" value={expAmount} onChange={e => setExpAmount(e.target.value)} className="w-24 p-2 border border-slate-300 rounded-lg font-mono"/>

                                        <button type="button" onClick={handleAddExpense} className="px-3 bg-red-600 text-white rounded-lg font-bold">-支出</button>

                                    </div>

                                </div>

                            )}

                            <div className="space-y-1 max-h-48 overflow-y-auto pt-2 border-t border-slate-100">

                                {incomes.map(i => (

                                    <div key={i.id} className="flex justify-between items-center bg-emerald-50/70 p-2 rounded-lg text-emerald-900">

                                        <span>➕ {i.desc}</span>

                                        <div className="flex items-center gap-2">

                                            <span className="font-mono font-bold">+${Number(i.amount).toLocaleString()}</span>

                                            {!isClosed && <button onClick={() => setIncomes(incomes.filter(x => x.id !== i.id))} className="text-red-500"><Trash2 size={13}/></button>}

                                        </div>

                                    </div>

                                ))}

                                {expenses.map(e => (

                                    <div key={e.id} className="flex justify-between items-center bg-red-50/70 p-2 rounded-lg text-red-900">

                                        <span>➖ {e.desc}</span>

                                        <div className="flex items-center gap-2">

                                            <span className="font-mono font-bold">-${Number(e.amount).toLocaleString()}</span>

                                            {!isClosed && <button onClick={() => setExpenses(expenses.filter(x => x.id !== e.id))} className="text-red-500"><Trash2 size={13}/></button>}

                                        </div>

                                    </div>

                                ))}

                                {incomes.length === 0 && expenses.length === 0 && (

                                    <div className="text-center text-slate-400 py-4">當日尚無額外手工收支項目</div>

                                )}

                            </div>

                        </div>



                        <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">

                            <div className="flex justify-between items-center">

                                <h3 className="font-bold text-slate-800 text-sm">實際抽屜現金清點</h3>

                                <button 

                                    type="button" 

                                    onClick={() => setShowCalculator(!showCalculator)} 

                                    className="text-xs text-blue-600 font-bold underline flex items-center gap-1"

                                >

                                    <Calculator size={14}/> {showCalculator ? '改為直接輸入總額' : '展開鈔票硬幣點鈔機'}

                                </button>

                            </div>



                            {showCalculator ? (

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">

                                    {[1000, 500, 100, 50, 10, 5, 1].map(d => (

                                        <div key={d} className="bg-white p-2 rounded-lg border border-slate-200">

                                            <label className="text-[10px] font-bold text-slate-500 block">${d} 元張/枚數</label>

                                            <input 

                                                type="number" 

                                                disabled={isClosed}

                                                value={denoms[d] || ''} 

                                                onChange={e => setDenoms({ ...denoms, [d]: e.target.value })} 

                                                placeholder="0"

                                                className="w-full mt-1 p-1 border border-slate-300 rounded text-right font-mono font-bold"

                                            />

                                        </div>

                                    ))}

                                    <div className="bg-blue-600 text-white p-2 rounded-lg flex flex-col justify-center items-end">

                                        <span className="text-[10px]">點鈔合計</span>

                                        <span className="font-mono font-black text-sm">${denomTotal.toLocaleString()}</span>

                                    </div>

                                </div>

                            ) : (

                                <div>

                                    <label className="text-xs font-bold text-slate-600 block mb-1">實際清點現金總額 ($)</label>

                                    <input 

                                        type="number" 

                                        disabled={isClosed}

                                        value={manualActualCash} 

                                        onChange={e => setManualActualCash(e.target.value)} 

                                        placeholder="請輸入實際清點總金額"

                                        className="w-full p-2.5 border border-slate-300 rounded-xl font-mono font-black text-base outline-none focus:border-blue-500"

                                    />

                                </div>

                            )}



                            <div>

                                <label className="text-xs font-bold text-slate-600 block mb-1">交班對帳備註</label>

                                <input 

                                    type="text" 

                                    disabled={isClosed}

                                    value={note} 

                                    onChange={e => setNote(e.target.value)} 

                                    placeholder="如有短溢或特殊交辦事項請填寫..."

                                    className="w-full p-2 border border-slate-300 rounded-xl outline-none"

                                />

                            </div>



                            <div className="flex gap-2 pt-2">

                                {!isClosed ? (

                                    <Fragment>

                                        <button type="button" onClick={() => handleSaveCashRecord(false)} className="flex-1 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl font-bold">

                                            暫存對帳草稿

                                        </button>

                                        <button type="button" onClick={() => handleSaveCashRecord(true)} className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black shadow-xs">

                                            確認無誤 ➜ 關帳鎖定

                                        </button>

                                    </Fragment>

                                ) : (

                                    <button type="button" onClick={() => setIsClosed(false)} className="w-full py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-xl font-bold">

                                        解除關帳鎖定以重新修改

                                    </button>

                                )}

                            </div>

                        </div>

                    </div>

                </div>

            );

        };



        const ReceiptModal = ({ showReceiptModal, setShowReceiptModal, selectedRecord, shopInfo, gasUrl, showAlert }) => {

            const [emailModalOpen, setEmailModalOpen] = useState(false);

            const [targetEmail, setTargetEmail] = useState('');

            const [emailSubject, setEmailSubject] = useState('');

            const [emailBody, setEmailBody] = useState('');

            const [isSendingEmail, setIsSendingEmail] = useState(false);



            if (!showReceiptModal || !selectedRecord) return null;



            const items = normalizeItems(selectedRecord.items);

            const hourlyRate = cleanNumber(selectedRecord.hourlyRate || shopInfo?.hourlyRate, 800);

            const isWaitingParts = selectedRecord.status === 'in_progress' && selectedRecord.progressStage === '等待備料';

            const isInProgress = selectedRecord.status === 'in_progress' && selectedRecord.progressStage !== '等待備料';

            const docTitle = isWaitingParts ? '零件採購備料品項明細單' : isInProgress ? '車輛維修施工委託單' : '完工結帳正式收據';

            const insp = selectedRecord.inspection || INITIAL_INSPECTION;



            const getItemSub = (it) => {

                if (it.subtotal !== undefined && it.subtotal !== null && it.subtotal !== '') return evaluateMathExpression(it.subtotal, 0);

                return (evaluateMathExpression(it.partsPrice, 0) + (evaluateMathExpression(it.laborHours, 0) * hourlyRate)) * Number(it.qty || 1);

            };



            const openPartsEmailDialog = () => {

                const defaultSub = `【${shopInfo?.name || 'Source Moto'}】零件採購備料品項明細單 - ${selectedRecord.plate}`;

                let txt = `親愛的 ${selectedRecord.name || '車主'} 您好：\n\n`;

                txt += `以下為您的愛車【${selectedRecord.plate} (${selectedRecord.bikeModel || '機車'})】於本店登記之零件採購備料明細：\n`;

                txt += `開單日期：${formatDate(selectedRecord.date)}\n`;

                txt += `預計到貨日：${selectedRecord.partsDueDate || '待廠商確認'}\n`;

                txt += `----------------------------------\n`;

                items.forEach((it, idx) => {

                    const st = getItemStatus(it);

                    const stLabel = st === 'fulfilled' ? '✅已到貨' : st === 'processing' ? '🔄處理中' : '⬜待料中';

                    txt += `${idx + 1}. [${stLabel}] ${it.name} x${it.qty || 1} - $${Math.round(getItemSub(it)).toLocaleString()}\n`;

                });

                txt += `----------------------------------\n`;

                txt += `預估總金額：$${cleanNumber(selectedRecord.total, 0).toLocaleString()} 元\n`;

                if (selectedRecord.hasDeposit) {

                    txt += `已收定金：$${cleanNumber(selectedRecord.depositAmount, 0).toLocaleString()} 元\n`;

                    txt += `交車待結尾款：$${cleanNumber(selectedRecord.remainingBalance, 0).toLocaleString()} 元\n`;

                }

                txt += `\n門市電話：${shopInfo?.phone || ''}\n門市地址：${shopInfo?.address || ''}`;

                setTargetEmail(selectedRecord.email || '');

                setEmailSubject(defaultSub);

                setEmailBody(txt);

                setEmailModalOpen(true);

            };



            const handleSendPartsEmail = async () => {

                if (!targetEmail || !targetEmail.includes('@')) return showAlert('請輸入有效的收件人 Email 信箱');

                setIsSendingEmail(true);

                const res = await safeFetchGAS(gasUrl, {

                    action: 'send_maintenance_reminder',

                    email: targetEmail.trim(),

                    subject: emailSubject,

                    customText: emailBody,

                    shopInfo

                });

                setIsSendingEmail(false);

                if (res.ok && res.data && res.data.status === 'success') {

                    showAlert(`✅ 備料明細單已成功寄送至 ${targetEmail}！`);

                    setEmailModalOpen(false);

                } else {

                    showAlert(`❌ 寄送失敗：${res.error || '請確認網路與 GAS 設定'}`);

                }

            };



            const handleShareLine = () => {

                let txt = `【${shopInfo?.name || 'Source Moto'}】${docTitle}\n`;

                txt += `單號: #${String(selectedRecord?.id || '8888').slice(-6)}\n`;

                txt += `日期: ${formatDate(selectedRecord.date)}\n`;

                txt += `車牌: ${selectedRecord.plate} (${selectedRecord.bikeModel || '-'})\n`;

                txt += `里程: ${selectedRecord.mileage || '-'} km\n`;

                txt += `--------------------------\n`;

                items.forEach((it, idx) => {

                    txt += `${idx + 1}. ${it.name} x${it.qty || 1} = $${Math.round(getItemSub(it)).toLocaleString()}\n`;

                });

                txt += `--------------------------\n`;

                txt += `總計金額: $${cleanNumber(selectedRecord.total, 0).toLocaleString()} 元\n`;

                if (selectedRecord.hasDeposit) {

                    txt += `已付定金: $${cleanNumber(selectedRecord.depositAmount, 0).toLocaleString()} 元\n`;

                    txt += `待收尾款: $${cleanNumber(selectedRecord.remainingBalance, 0).toLocaleString()} 元\n`;

                }

                copyToClipboard(txt, () => {

                    window.open(`https://line.me/R/msg/text/?${encodeURIComponent(txt)}`, '_blank');

                });

            };



            return (

                <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center z-[9999] p-4 overflow-y-auto">

                    <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden my-auto">

                        <div className="bg-slate-900 text-white p-3.5 flex justify-between items-center no-print">

                            <span className="font-bold text-xs flex items-center gap-1.5"><Printer size={16}/> {docTitle}預覽</span>

                            <div className="flex items-center gap-1.5">

                                {isWaitingParts ? (

                                    <button onClick={openPartsEmailDialog} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold flex items-center gap-1">

                                        <Mail size={14}/> 寄送 Email

                                    </button>

                                ) : (

                                    <button onClick={handleShareLine} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold flex items-center gap-1">

                                        <ShareNetwork size={14}/> LINE 分享

                                    </button>

                                )}

                                <button onClick={() => window.print()} className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-bold flex items-center gap-1">

                                    <Printer size={14}/> 列印

                                </button>

                                <button onClick={() => setShowReceiptModal(false)} className="p-1 text-slate-400 hover:text-white"><X size={18}/></button>

                            </div>

                        </div>



                        <div className="p-6 space-y-4 text-xs" id="printable-receipt">

                            <div className="text-center border-b border-slate-200 pb-3">

                                <h2 className="text-lg font-black text-slate-900">{shopInfo?.name || 'Source Moto Custom'}</h2>

                                <p className="text-[11px] text-slate-500">{shopInfo?.address} | TEL: {shopInfo?.phone}</p>

                                <div className="mt-2 inline-block px-3 py-0.5 rounded-full bg-slate-100 font-black text-slate-800 text-xs">

                                    {docTitle} #{String(selectedRecord?.id || '8888').slice(-6)}

                                </div>

                            </div>



                            <div className="grid grid-cols-2 gap-1.5 text-[11px] bg-slate-50 p-3 rounded-xl border border-slate-200">

                                <div>車牌號碼：<strong className="font-mono text-slate-900">{selectedRecord.plate}</strong></div>

                                <div>開單日期：<strong>{formatDate(selectedRecord.date)}</strong></div>

                                <div>車主姓名：<strong>{selectedRecord.name || '現場車主'}</strong></div>

                                <div>進廠里程：<strong>{selectedRecord.mileage || '-'} km</strong></div>

                                <div>車種型號：<strong>{selectedRecord.bikeModel || '-'}</strong></div>

                                {isWaitingParts && <div className="text-orange-700 font-bold">預計到貨：{selectedRecord.partsDueDate || '待通知'}</div>}

                            </div>



                            <table className="w-full text-left text-xs border-collapse">

                                <thead>

                                    <tr className="border-b-2 border-slate-800 text-slate-700 font-bold">

                                        <th className="py-1.5">品項名稱</th>

                                        {isWaitingParts && <th className="py-1.5 text-center">備料狀態</th>}

                                        <th className="py-1.5 text-center">數量</th>

                                        <th className="py-1.5 text-right">小計</th>

                                    </tr>

                                </thead>

                                <tbody className="divide-y divide-slate-200">

                                    {items.map((it, idx) => {

                                        const st = getItemStatus(it);

                                        return (

                                            <tr key={idx}>

                                                <td className="py-2 font-bold text-slate-800">{it.name}</td>

                                                {isWaitingParts && (

                                                    <td className="py-2 text-center text-[10px] font-bold">

                                                        {st === 'fulfilled' ? '✅已到貨' : st === 'processing' ? '🔄處理中' : '⬜待料中'}

                                                    </td>

                                                )}

                                                <td className="py-2 text-center font-mono">x{it.qty || 1}</td>

                                                <td className="py-2 text-right font-mono font-bold">${Math.round(getItemSub(it)).toLocaleString()}</td>

                                            </tr>

                                        );

                                    })}

                                </tbody>

                            </table>



                            <div className="border-t-2 border-slate-800 pt-3 space-y-1">

                                <div className="flex justify-between text-sm font-black">

                                    <span>總計金額 ({selectedRecord.paymentMethod || '現金'})</span>

                                    <span className="font-mono">${cleanNumber(selectedRecord.total, 0).toLocaleString()}</span>

                                </div>

                                {selectedRecord.hasDeposit && (

                                    <div className="flex justify-between text-xs text-indigo-700 font-bold">

                                        <span>已收定金：${cleanNumber(selectedRecord.depositAmount, 0).toLocaleString()}</span>

                                        <span>待收尾款：${cleanNumber(selectedRecord.remainingBalance, 0).toLocaleString()}</span>

                                    </div>

                                )}

                            </div>



                            <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-[10px] text-slate-600">

                                <div className="font-bold text-slate-700 mb-1">🛡️ 車況四大安全健檢紀錄：</div>

                                <div className="grid grid-cols-4 gap-1 text-center">

                                    <div className="bg-white p-1 rounded border">輪胎: <strong>{insp.tires || '良好'}</strong></div>

                                    <div className="bg-white p-1 rounded border">煞車: <strong>{insp.brakes || '良好'}</strong></div>

                                    <div className="bg-white p-1 rounded border">傳動: <strong>{insp.belt || '良好'}</strong></div>

                                    <div className="bg-white p-1 rounded border">電瓶: <strong>{insp.battery || '12.8V'}</strong></div>

                                </div>

                            </div>



                            <div className="text-center text-[10px] text-slate-400 pt-2">

                                {shopInfo?.note}

                            </div>

                        </div>

                    </div>



                    {emailModalOpen && (

                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[10001] p-4 no-print">

                            <div className="bg-white w-full max-w-md rounded-2xl p-4 space-y-3 text-xs">

                                <h3 className="font-bold text-slate-800 text-sm flex items-center gap-1.5">

                                    <Mail size={16} className="text-blue-600"/> 寄送備料品項明細單 Email

                                </h3>

                                <input type="email" value={targetEmail} onChange={e => setTargetEmail(e.target.value)} placeholder="請輸入對方 Email 信箱" className="w-full p-2 border border-slate-300 rounded-xl font-mono font-bold"/>

                                <input type="text" value={emailSubject} onChange={e => setEmailSubject(e.target.value)} className="w-full p-2 border border-slate-300 rounded-xl font-bold"/>

                                <textarea rows={8} value={emailBody} onChange={e => setEmailBody(e.target.value)} className="w-full p-2 border border-slate-300 rounded-xl font-mono text-[11px]"></textarea>

                                <div className="flex justify-end gap-2">

                                    <button onClick={() => setEmailModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl font-bold">取消</button>

                                    <button onClick={handleSendPartsEmail} disabled={isSendingEmail} className="px-4 py-2 bg-blue-600 text-white rounded-xl font-bold">

                                        {isSendingEmail ? '寄送中...' : '確認寄出'}

                                    </button>

                                </div>

                            </div>

                        </div>

                    )}

                </div>

            );

        };


        const App = () => {

            const [view, setView] = useState('dashboard');

            const [shopInfo, setShopInfo] = useState(() => loadFromLocal('moto_shopInfo', DEFAULT_SHOP_INFO, false));

            const [records, setRecords] = useState(() => loadFromLocal('moto_records', []).map(normalizeRecord));

            const [customers, setCustomers] = useState(() => loadFromLocal('moto_customers', []));

            const [quickServices, setQuickServices] = useState(() => loadFromLocal('moto_quickServices', DEFAULT_SERVICES));

            const [staffList, setStaffList] = useState(() => loadFromLocal('moto_staffList', ['MICHAEL', '阿宇', '小豪']));

            const [staffProfiles, setStaffProfiles] = useState(() => loadFromLocal('moto_staffProfiles', DEFAULT_STAFF_PROFILES, false));

            const [cashRecords, setCashRecords] = useState(() => loadFromLocal('moto_cashRecords', []));



            const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('moto_gasUrl') || DEFAULT_GAS_URL);

            const [tempUrl, setTempUrl] = useState(() => localStorage.getItem('moto_gasUrl') || DEFAULT_GAS_URL);

            const [isCloudEnabled, setIsCloudEnabled] = useState(true);

            const [isInitialSyncDone, setIsInitialSyncDone] = useState(false);

            const [lastSyncError, setLastSyncError] = useState(null);

            const [isLoading, setIsLoading] = useState(false);

            const [isSavingSettings, setIsSavingSettings] = useState(false);

            const [isUploadingOrder, setIsUploadingOrder] = useState(false);



            const [draftOrder, setDraftOrder] = useState(INITIAL_ORDER_STATE);

            const [editingOrderId, setEditingOrderId] = useState(null);

            const [selectedRecord, setSelectedRecord] = useState(null);

            const [showReceiptModal, setShowReceiptModal] = useState(false);



            const [currentPin, setCurrentPin] = useState(() => localStorage.getItem('moto_adminPin') || '0511');

            const [isUnlocked, setIsUnlocked] = useState(false);

            const [isPinModalOpen, setIsPinModalOpen] = useState(false);

            const [pendingView, setPendingView] = useState(null);

            const pendingActionRef = useRef(null);



            const [dialog, setDialog] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null });

            const showAlert = (message) => setDialog({ isOpen: true, type: 'alert', message, onConfirm: null });

            const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, type: 'confirm', message, onConfirm });



            useEffect(() => {
                const savedRecs = loadFromLocal('moto_records', []);
                if (Array.isArray(savedRecs) && savedRecs.length > 0) {
                    setRecords(savedRecs.map(normalizeRecord));
                }
            }, []);

            useEffect(() => {
                saveToLocalSafe('moto_shopInfo', shopInfo);
                saveToLocalSafe('moto_records', records);
                saveToLocalSafe('moto_customers', customers);
                saveToLocalSafe('moto_quickServices', quickServices);
                saveToLocalSafe('moto_staffList', staffList);
                saveToLocalSafe('moto_staffProfiles', staffProfiles);
                saveToLocalSafe('moto_cashRecords', cashRecords);
            }, [shopInfo, records, customers, quickServices, staffList, staffProfiles, cashRecords]);

            const fetchCloudData = async (urlToUse = gasUrl, silent = false) => {
                if (!urlToUse) return;
                if (!silent) setIsLoading(true);
                try {
                    const res = await safeFetchGAS(urlToUse, { action: 'get_all' });
                    if (res.ok && res.data && res.data.status === 'success') {
                        // 1. 工單雙向智慧合流：確保無 ID 或重複 ID 的 6~10 月歷史工單皆能生成唯一識別碼並完整載入
                        if (Array.isArray(res.data.records)) {
                            setRecords(prev => {
                                if (res.data.records.length === 0 && prev.length > 0) {
                                    return prev;
                                }
                                const prevMap = new Map();
                                prev.forEach((p, idx) => {
                                    if (p) {
                                        const normP = normalizeRecord(p, idx);
                                        prevMap.set(String(normP.id), normP);
                                    }
                                });

                                const map = new Map();
                                res.data.records.forEach((r, idx) => { 
                                    if (r && (r.plate || r.date || r.total !== undefined || r.human_items || r.id)) {
                                        const normCloud = normalizeRecord(r, idx);
                                        let key = String(normCloud.id);
                                        // 若遇到同分頁內舊資料 ID 碰撞，但車牌或日期不同，自動加上列索引確保不互相覆蓋
                                        if (map.has(key)) {
                                            const existing = map.get(key);
                                            if (existing.plate !== normCloud.plate || existing.date !== normCloud.date || existing.total !== normCloud.total) {
                                                key = `${key}_ROW_${idx}`;
                                                normCloud.id = key;
                                            }
                                        }
                                        const normLocal = prevMap.get(key);
                                        if (normLocal && (!normCloud.items || normCloud.items.length === 0) && normLocal.items && normLocal.items.length > 0) {
                                            normCloud.items = normLocal.items;
                                            normCloud.human_items = normLocal.human_items || buildHumanItemsStr(normLocal.items, '');
                                        }
                                        if (normCloud.status === 'completed') {
                                            normCloud.progressStage = '已完工';
                                        }
                                        map.set(key, normCloud); 
                                    }
                                });
                                prev.forEach((r, idx) => { 
                                    if (r) {
                                        const normLocal = normalizeRecord(r, idx);
                                        if (!map.has(String(normLocal.id))) {
                                            map.set(String(normLocal.id), normLocal); 
                                        }
                                    }
                                });
                                return Array.from(map.values()).sort((a, b) => parseDateSafe(b.date || b.timestamp) - parseDateSafe(a.date || a.timestamp));
                            });
                        }

                        // 2. 客戶車籍智慧合流：以車牌號碼為準進行雙向整合
                        if (Array.isArray(res.data.customers)) {
                            setCustomers(prev => {
                                if (res.data.customers.length === 0 && prev.length > 0) {
                                    return prev;
                                }
                                const map = new Map();
                                res.data.customers.forEach(c => {
                                    if (c && c.plate) map.set(String(c.plate).trim().toUpperCase(), c);
                                });
                                prev.forEach(c => {
                                    if (c && c.plate && !map.has(String(c.plate).trim().toUpperCase())) {
                                        map.set(String(c.plate).trim().toUpperCase(), c);
                                    }
                                });
                                return Array.from(map.values());
                            });
                        }

                        if (res.data.settings) {
                            const settings = res.data.settings;

                            let parsedShopInfo = settings.shopInfo;
                            if (typeof parsedShopInfo === 'string') {
                                try { parsedShopInfo = JSON.parse(parsedShopInfo); } catch (e) {}
                            }
                            if (parsedShopInfo && typeof parsedShopInfo === 'object') {
                                setShopInfo(prev => {
                                    const savedCustomLogo = loadFromLocal('moto_customLogo', null, false);
                                    const incomingLogo = parsedShopInfo.logo;
                                    // ★ 關鍵防護：若本機已上傳自訂 Logo，而雲端傳回空值或預設舊 Logo，強制保留本機自訂 Logo！
                                    let finalLogo = incomingLogo || prev.logo || DEFAULT_LOGO;
                                    if (savedCustomLogo && (!incomingLogo || incomingLogo === DEFAULT_LOGO)) {
                                        finalLogo = savedCustomLogo;
                                    } else if (incomingLogo && incomingLogo !== DEFAULT_LOGO) {
                                        saveToLocalSafe('moto_customLogo', incomingLogo);
                                    }
                                    return { ...prev, ...parsedShopInfo, logo: finalLogo };
                                });
                            }

                            let parsedServices = settings.quickServices;
                            if (typeof parsedServices === 'string') {
                                try { parsedServices = JSON.parse(parsedServices); } catch (e) {}
                            }
                            if (Array.isArray(parsedServices)) setQuickServices(parsedServices);

                            let parsedStaffList = settings.staffList;
                            if (typeof parsedStaffList === 'string') {
                                try { parsedStaffList = JSON.parse(parsedStaffList); } catch (e) {}
                            }
                            if (Array.isArray(parsedStaffList)) setStaffList(parsedStaffList);

                            let cloudProfiles = null;
                            if (Array.isArray(settings.staffProfilesRows) && settings.staffProfilesRows.length > 0) {
                                cloudProfiles = {};
                                settings.staffProfilesRows.forEach(r => {
                                    if (r && r.name) {
                                        cloudProfiles[r.name] = {
                                            role: r.role || '一般技師',
                                            years: Number(r.years || 1),
                                            baseSalary: Number(r.baseSalary || 36000),
                                            laborBonusRate: Number(r.laborBonusRate || 22),
                                            referralBonusRate: Number(r.referralBonusRate || 15)
                                        };
                                    }
                                });
                            } else {
                                cloudProfiles = settings.staffProfiles;
                                if (typeof cloudProfiles === 'string') {
                                    try { cloudProfiles = JSON.parse(cloudProfiles); } catch (e) {}
                                }
                            }

                            if ((!cloudProfiles || typeof cloudProfiles !== 'object' || Object.keys(cloudProfiles).length === 0) && parsedShopInfo && parsedShopInfo.staffProfiles) {
                                cloudProfiles = parsedShopInfo.staffProfiles;
                                if (typeof cloudProfiles === 'string') {
                                    try { cloudProfiles = JSON.parse(cloudProfiles); } catch (e) {}
                                }
                            }

                            if (cloudProfiles && typeof cloudProfiles === 'object' && Object.keys(cloudProfiles).length > 0) {
                                setStaffProfiles(prev => {
                                    const merged = { ...DEFAULT_STAFF_PROFILES, ...prev, ...cloudProfiles };
                                    saveToLocalSafe('moto_staffProfiles', merged);
                                    return merged;
                                });
                            }

                            let parsedCash = settings.cashRecords;
                            if (typeof parsedCash === 'string') {
                                try { parsedCash = JSON.parse(parsedCash); } catch (e) {}
                            }
                            if (Array.isArray(parsedCash)) setCashRecords(parsedCash);

                            if (settings.adminPin) {
                                setCurrentPin(String(settings.adminPin));
                                localStorage.setItem('moto_adminPin', String(settings.adminPin));
                            }
                        }
                        setIsCloudEnabled(true);
                        setIsInitialSyncDone(true);
                        setLastSyncError(null);
                    } else {
                        const errDetail = res.error || (res.data && res.data.message) || '雲端試算表回應異常';
                        setLastSyncError(errDetail);
                        if (!silent) {
                            showAlert(`⚠️ 雲端同步讀取失敗：\n${errDetail}\n\n請確認 Google Apps Script 已更新貼上最新 Code.gs 並以「新版本」部署！`);
                        }
                    }
                } catch (e) {
                    console.warn("Cloud sync warning:", e);
                    setLastSyncError(e.message || '連線發生例外錯誤');
                } finally {
                    if (!silent) setIsLoading(false);
                }
            };

            // 多裝置即時同步監聽：螢幕喚醒/分頁切換自動同步 + 每 25 秒背景靜默輪詢
            useEffect(() => {
                fetchCloudData(gasUrl, true);

                const handleFocusSync = () => {
                    fetchCloudData(undefined, true);
                };

                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') {
                        fetchCloudData(undefined, true);
                    }
                };

                window.addEventListener('focus', handleFocusSync);
                document.addEventListener('visibilitychange', handleVisibilityChange);

                const pollTimer = setInterval(() => {
                    if (document.visibilityState === 'visible') {
                        fetchCloudData(undefined, true);
                    }
                }, 25000);

                return () => {
                    window.removeEventListener('focus', handleFocusSync);
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    clearInterval(pollTimer);
                };
            }, [gasUrl]);

            const testConnection = async (url) => {
                if (!url) return showAlert('請輸入 Google Apps Script 網址');
                setIsLoading(true);
                const res = await safeFetchGAS(url, { action: 'test' });
                setIsLoading(false);
                if (res.ok && res.data && res.data.status === 'success') {
                    setGasUrl(url);
                    localStorage.setItem('moto_gasUrl', url);
                    setIsCloudEnabled(true);
                    setLastSyncError(null);
                    const sheetTitle = res.data.spreadsheetName ? `\n已綁定試算表：【${res.data.spreadsheetName}】` : '';
                    showAlert(`✅ 雲端伺服器連線成功！${sheetTitle}`);
                    fetchCloudData(url, false);
                } else {
                    const errDetail = res.error || (res.data && res.data.message) || '請檢查 Apps Script 權限設定與部署版本';
                    setLastSyncError(errDetail);
                    showAlert(`❌ 連線失敗：\n${errDetail}`);
                }
            };

            // ★★★ 安全設定儲存：若後端有舊邏輯，隨附過濾相片後的輕量工單以防被清空 ★★★
            const saveSettingsToCloud = async (customCash = null, silent = false, updatedPin = null, customProfiles = null, customStaffList = null, customRows = null, customCustomers = null, customRecords = null, customShopInfo = null) => {
                setIsSavingSettings(true);
                const pinToSave = updatedPin || currentPin;
                const profilesToSave = customProfiles || staffProfiles;
                const staffListToSave = customStaffList || staffList;
                const customersToSave = customCustomers || customers;
                const baseShop = customShopInfo || shopInfo;

                // 產出分欄分行陣列（每位技師各獨立一行與欄位）
                const rowsToSave = customRows || staffListToSave.map(name => {
                    const p = (profilesToSave && profilesToSave[name]) || DEFAULT_STAFF_PROFILES[name] || {};
                    return {
                        name,
                        role: p.role || '一般技師',
                        years: Number(p.years !== undefined ? p.years : 1),
                        baseSalary: Number(p.baseSalary !== undefined ? p.baseSalary : 36000),
                        laborBonusRate: Number(p.laborBonusRate !== undefined ? p.laborBonusRate : 22),
                        referralBonusRate: Number(p.referralBonusRate !== undefined ? p.referralBonusRate : 15)
                    };
                });

                const updatedShopInfo = {
                    ...baseShop,
                    staffProfiles: profilesToSave
                };
                // 建立輕量化安全工單備份（保留標準日期、時間戳記與完整維修保養內容）
                const baseRecords = customRecords || records;
                const safeLightRecords = baseRecords.map(rawRec => {
                    const r = normalizeRecord(rawRec);
                    return {
                        id: r.id, 
                        date: r.date || getLocalDateString(new Date()), 
                        completedDate: r.completedDate || (r.status === 'completed' ? (r.date || getLocalDateString(new Date())) : ''),
                        timestamp: r.timestamp || r.updatedAt || new Date().toISOString(),
                        updatedAt: r.updatedAt || new Date().toISOString(),
                        plate: r.plate, name: r.name, phone: r.phone,
                        bikeModel: r.bikeModel, mileage: r.mileage, total: r.total, status: r.status,
                        progressStage: r.progressStage, 
                        items: r.items,
                        human_items: buildHumanItemsStr(r.items, r.human_items),
                        hasDeposit: r.hasDeposit, depositAmount: r.depositAmount, remainingBalance: r.remainingBalance,
                        partsDueDate: r.partsDueDate
                    };
                });

                const payload = {
                    action: 'save_settings',
                    shopInfo: updatedShopInfo,
                    quickServices,
                    staffList: staffListToSave,
                    staffProfiles: profilesToSave,
                    staffProfilesRows: rowsToSave,
                    records: safeLightRecords, // ★ 隨附輕量工單，舊 GAS 也不會清空
                    customers: customersToSave, // ★ 優先採用即時傳入的更新名冊
                    cashRecords: customCash || cashRecords,
                    adminPin: pinToSave
                };

                const res = await safeFetchGAS(gasUrl, payload, 45000);
                setIsSavingSettings(false);

                if (res.ok && res.data && (res.data.status === 'success' || res.data.ok)) {
                    if (!silent) showAlert('✅ 系統設定與備份已安全同步至 Google 試算表！');
                    return true;
                } else {
                    const errMsg = res.error || (res.data && res.data.message) || '伺服器連線未正確回應';
                    if (!silent) {
                        showAlert(`⚠️ 雲端同步失敗：${errMsg}\n（本地資料已安全保存）`);
                    }
                    return false;
                }
            };

            const handleCreateOrder = async (orderPayload, editId = null) => {
                setIsUploadingOrder(true);
                const ds = getLocalDateString(new Date());
                const ts = new Date().toISOString();

                let updatedRecords = [...records];
                let targetRecord = null;

                if (editId) {
                    updatedRecords = updatedRecords.map(r => {
                        if (r.id === editId) {
                            targetRecord = normalizeRecord({ 
                                ...r, 
                                ...orderPayload, 
                                id: editId, 
                                human_items: buildHumanItemsStr(orderPayload.items, r.human_items),
                                completedDate: orderPayload.status === 'completed' ? (orderPayload.completedDate || r.completedDate || ds) : '',
                                updatedAt: ts 
                            });
                            return targetRecord;
                        }
                        return r;
                    });
                } else {
                    targetRecord = normalizeRecord({
                        ...orderPayload,
                        id: String(Date.now()),
                        date: orderPayload.date || ds,
                        human_items: buildHumanItemsStr(orderPayload.items, orderPayload.human_items),
                        completedDate: orderPayload.status === 'completed' ? (orderPayload.completedDate || ds) : '',
                        timestamp: ts,
                        updatedAt: ts
                    });
                    updatedRecords = [targetRecord, ...records];
                }

                setRecords(updatedRecords);

                const cPlate = String(orderPayload.plate).toUpperCase();
                let updatedCustomers = [...customers];
                const existC = updatedCustomers.find(c => c.plate === cPlate);
                const custObj = {
                    id: existC ? existC.id : String(Date.now()),
                    plate: cPlate,
                    name: orderPayload.name || (existC ? existC.name : ''),
                    phone: orderPayload.phone || (existC ? existC.phone : ''),
                    email: orderPayload.email || (existC ? existC.email : ''),
                    bikeModel: orderPayload.bikeModel || (existC ? existC.bikeModel : ''),
                    year: orderPayload.year || (existC ? existC.year : ''),
                    lastVisit: ds,
                    lastMileage: orderPayload.mileage || (existC ? existC.lastMileage : '')
                };

                if (existC) {
                    updatedCustomers = updatedCustomers.map(c => c.id === existC.id ? custObj : c);
                } else {
                    updatedCustomers.push(custObj);
                }
                setCustomers(updatedCustomers);

                const updatedServices = quickServices.map(s => {
                    const used = orderPayload.items.find(i => i.name === s.name);
                    if (used) {
                        return { ...s, stock: Math.max(0, (s.stock || 0) - Number(used.qty || 1)) };
                    }
                    return s;
                });
                setQuickServices(updatedServices);

                // 單筆即時寫入後端試算表（不使用會抹殺他人資料的全清空）
                try {
                    await safeFetchGAS(gasUrl, {
                        action: 'add_order',
                        record: targetRecord,
                        customer: custObj,
                        sendEmail: Boolean(orderPayload.status === 'completed' && custObj.email),
                        shopInfo
                    });
                } catch (e) {
                    console.warn("GAS save error:", e);
                }

                setIsUploadingOrder(false);
                setDraftOrder(INITIAL_ORDER_STATE);
                setEditingOrderId(null);

                if (orderPayload.status === 'completed') {
                    setSelectedRecord(targetRecord);
                    setShowReceiptModal(true);
                }
                setView('dashboard');
            };

            // 工單狀態切換（附帶安全合流參數，防止洗掉未傳送欄位）
            const handleStatusChange = (id, newStatus) => {
                const ts = new Date().toISOString();
                const ds = getLocalDateString(new Date());
                const updated = records.map(r => r.id === id ? { 
                    ...r, 
                    status: newStatus, 
                    progressStage: newStatus === 'completed' ? '已完工' : '維修中',
                    completedDate: newStatus === 'completed' ? (r.completedDate || ds) : '',
                    updatedAt: ts 
                } : r);
                setRecords(updated);
                const target = updated.find(r => r.id === id);
                if (target && newStatus === 'completed') {
                    setSelectedRecord(target);
                    setShowReceiptModal(true);
                }
                safeFetchGAS(gasUrl, { 
                    action: 'save_settings', 
                    records: updated,
                    customers,
                    cashRecords,
                    quickServices,
                    shopInfo
                });
            };

            const handleUpdateOrderStage = (id, newStage) => {
                const ts = new Date().toISOString();
                const updated = records.map(r => r.id === id ? { ...r, progressStage: newStage, updatedAt: ts } : r);
                setRecords(updated);
                safeFetchGAS(gasUrl, { 
                    action: 'save_settings', 
                    records: updated,
                    customers,
                    cashRecords,
                    quickServices,
                    shopInfo
                });
            };

            const handleUpdateOrderField = (id, fields) => {
                const ts = new Date().toISOString();
                const updated = records.map(r => r.id === id ? { ...r, ...fields, updatedAt: ts } : r);
                setRecords(updated);
                safeFetchGAS(gasUrl, { 
                    action: 'save_settings', 
                    records: updated,
                    customers,
                    cashRecords,
                    quickServices,
                    shopInfo
                });
            };

            // 破壞性操作防護：刪除工單使用專屬 delete_order 指令，防止合流復合
            const deleteRecord = (id) => {
                const targetRec = records.find(r => String(r.id) === String(id));
                const executeDelete = () => {
                    showConfirm(`確定要作廢刪除【${targetRec ? `${targetRec.plate} ($${cleanNumber(targetRec.total, 0).toLocaleString()})` : '此工單'}】紀錄嗎？\n(此操作將同步自雲端試算表中移除)`, () => {
                        const updated = records.filter(r => String(r.id) !== String(id));
                        setRecords(updated);
                        saveToLocalSafe('moto_records', updated);
                        safeFetchGAS(gasUrl, { 
                            action: 'delete_order', 
                            id: String(id),
                            deletedRecord: targetRec ? { id: String(targetRec.id), plate: targetRec.plate, date: targetRec.date, total: targetRec.total } : null,
                            records: updated 
                        });
                        showAlert('工單已成功作廢刪除！');
                    });
                };
                if (!isUnlocked) {
                    requestAdminAuth(executeDelete);
                } else {
                    executeDelete();
                }
            };

            const requestAdminAuth = (actionCallback, forcePin = false) => {
                if (isUnlocked && !forcePin) {
                    if (actionCallback) actionCallback();
                    return;
                }
                pendingActionRef.current = actionCallback;
                setIsPinModalOpen(true);
            };

            const handleNavClick = (targetView) => {
                if (['settings', 'workforce', 'quote-inventory', 'customers'].includes(targetView) && !isUnlocked) {
                    setPendingView(targetView);
                    setIsPinModalOpen(true);
                    return;
                }
                setView(targetView);
            };

            const lockNow = () => {

                setIsUnlocked(false);

                if (['settings', 'workforce', 'quote-inventory', 'customers'].includes(view)) {

                    setView('dashboard');

                }

            };



            const handlePinSuccess = () => {

                setIsUnlocked(true);

                if (pendingActionRef.current) {

                    pendingActionRef.current();

                    pendingActionRef.current = null;

                }

                if (pendingView) {

                    setView(pendingView);

                    setPendingView(null);

                }

            };



            const inProgressCount = records.filter(r => r.status === 'in_progress' && r.progressStage !== '等待備料').length;

            const waitingPartsCount = records.filter(r => r.status === 'in_progress' && r.progressStage === '等待備料').length;



            return (

                <div className="flex h-[100dvh] w-screen overflow-hidden bg-slate-100 select-none">

                    <Sidebar 
                        view={view}
                        handleNavClick={handleNavClick}
                        isCloudEnabled={isCloudEnabled}
                        shopInfo={shopInfo}
                        inProgressCount={inProgressCount}
                        waitingPartsCount={waitingPartsCount}
                        fetchCloudData={fetchCloudData}
                        isLoading={isLoading}
                        isUnlocked={isUnlocked}
                        lockNow={lockNow}
                        isInitialSyncDone={isInitialSyncDone}
                        recordsCount={records.length}
                        lastSyncError={lastSyncError}
                    />

                    <div className="flex-1 flex flex-col h-full overflow-hidden">

                        <main className="flex-1 overflow-y-auto p-2.5 sm:p-4 md:p-6 pb-6">

                            {view === 'new-order' && (

                                <NewOrderForm 

                                    draftOrder={draftOrder}

                                    setDraftOrder={setDraftOrder}

                                    customers={customers}

                                    records={records}

                                    quickServices={quickServices}

                                    staffList={staffList}

                                    shopInfo={shopInfo}

                                    handleCreateOrder={handleCreateOrder}

                                    setView={setView}

                                    showAlert={showAlert}

                                    showConfirm={showConfirm}

                                    isUploadingOrder={isUploadingOrder}

                                    editingOrderId={editingOrderId}

                                    setEditingOrderId={setEditingOrderId}

                                    isUnlocked={isUnlocked}

                                    requestAdminAuth={requestAdminAuth}

                                />

                            )}



                            {view === 'dashboard' && (

                                <Dashboard 

                                    records={records}

                                    deleteRecord={deleteRecord}

                                    setSelectedRecord={setSelectedRecord}

                                    setShowReceiptModal={setShowReceiptModal}

                                    setDraftOrder={setDraftOrder}

                                    setEditingOrderId={setEditingOrderId}

                                    setView={setView}

                                    handleStatusChange={handleStatusChange}

                                    handleUpdateOrderStage={handleUpdateOrderStage}

                                    handleUpdateOrderField={handleUpdateOrderField}

                                    showConfirm={showConfirm}

                                    isUnlocked={isUnlocked}

                                    requestAdminAuth={requestAdminAuth}

                                />

                            )}



                            {view === 'quote-inventory' && (

                                <QuoteAndInventoryView 

                                    quickServices={quickServices}

                                    setQuickServices={setQuickServices}

                                    shopInfo={shopInfo}

                                    setDraftOrder={setDraftOrder}

                                    setView={setView}

                                    showAlert={showAlert}

                                    showConfirm={showConfirm}

                                />

                            )}



                            {view === 'reminders' && (

                                <RemindersView 

                                    customers={customers}

                                    setCustomers={setCustomers}

                                    records={records}

                                    shopInfo={shopInfo}

                                    gasUrl={gasUrl}

                                    isCloudEnabled={isCloudEnabled}

                                    showAlert={showAlert}

                                />

                            )}



                            {view === 'customers' && (

                                <CustomersView 

                                    customers={customers}

                                    setCustomers={setCustomers}

                                    records={records}

                                    setRecords={setRecords}

                                    saveSettingsToCloud={saveSettingsToCloud}

                                    showAlert={showAlert}

                                    showConfirm={showConfirm}

                                />

                            )}



                            {view === 'workforce' && (
                                <WorkforceView 
                                    records={records}
                                    staffList={staffList}
                                    shopInfo={shopInfo}
                                    staffProfiles={staffProfiles}
                                    setStaffProfiles={setStaffProfiles}
                                    isUnlocked={isUnlocked}
                                    requestAdminAuth={requestAdminAuth}
                                    showAlert={showAlert}
                                    gasUrl={gasUrl}
                                    saveSettingsToCloud={saveSettingsToCloud}
                                    isSavingSettings={isSavingSettings}
                                />
                            )}

                            {view === 'cashier' && (

                                <CashierView 

                                    records={records}

                                    cashRecords={cashRecords}

                                    setCashRecords={setCashRecords}

                                    showAlert={showAlert}

                                    showConfirm={showConfirm}

                                    saveSettingsToCloud={saveSettingsToCloud}

                                    isCloudEnabled={isCloudEnabled}

                                    isSavingSettings={isSavingSettings}

                                />

                            )}



                            {view === 'settings' && (
                                <SettingsView 
                                    tempUrl={tempUrl}
                                    setUrl={setTempUrl}
                                    gasUrl={gasUrl}
                                    fetchCloudData={fetchCloudData}
                                    shopInfo={shopInfo}
                                    setShopInfo={setShopInfo}
                                    staffList={staffList}
                                    setStaffList={setStaffList}
                                    staffProfiles={staffProfiles}
                                    setStaffProfiles={setStaffProfiles}
                                    quickServices={quickServices}
                                    setQuickServices={setQuickServices}
                                    records={records}
                                    setRecords={setRecords}
                                    customers={customers}
                                    setCustomers={setCustomers}
                                    cashRecords={cashRecords}
                                    setCashRecords={setCashRecords}
                                    testConnection={testConnection}
                                    isLoading={isLoading}
                                    isSavingSettings={isSavingSettings}
                                    saveSettingsToCloud={saveSettingsToCloud}
                                    currentPin={currentPin}
                                    setCurrentPin={setCurrentPin}
                                    showAlert={showAlert}
                                    showConfirm={showConfirm}
                                />
                            )}
                        </main>

                        <BottomNav 

                            view={view}

                            handleNavClick={handleNavClick}

                            inProgressCount={inProgressCount}

                            waitingPartsCount={waitingPartsCount}

                        />

                    </div>



                    <ReceiptModal 
                        showReceiptModal={showReceiptModal}
                        setShowReceiptModal={setShowReceiptModal}
                        selectedRecord={selectedRecord}
                        shopInfo={shopInfo}
                        gasUrl={gasUrl}
                        showAlert={showAlert}
                    />

                    <PinAuthModal 
                        isOpen={isPinModalOpen}

                        onClose={() => { 

                            setIsPinModalOpen(false); 

                            setPendingView(null); 

                            pendingActionRef.current = null;

                        }}

                        onSuccess={handlePinSuccess}

                        currentPin={currentPin}

                    />



                    <GlobalDialog 

                        dialog={dialog}

                        setDialog={setDialog}

                    />

                </div>

            );

        };



        const root = ReactDOM.createRoot(document.getElementById('root'));

        root.render(<App />);

    </script>

</body>

</html>
