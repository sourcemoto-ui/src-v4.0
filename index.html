        const getLocalDateString = (dateObj) => {

            if (!dateObj || isNaN(new Date(dateObj).getTime())) dateObj = new Date();

            const d = new Date(dateObj);

            return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];

        };



        const parseDateSafe = (dateVal) => {

            if (!dateVal) return new Date();

            if (dateVal instanceof Date && !isNaN(dateVal.getTime())) return dateVal;

            const s = String(dateVal).trim().replace(/^["']+|["']+$/g, '');

            if (!s) return new Date();

            const zhMatch = s.match(/(\d{4})\s*[年\/\-\.]\s*(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})/);

            if (zhMatch) {

                const dt = new Date(parseInt(zhMatch[1], 10), parseInt(zhMatch[2], 10) - 1, parseInt(zhMatch[3], 10));

                if (!isNaN(dt.getTime())) return dt;

            }

            const d = new Date(s);

            if (!isNaN(d.getTime())) return d;

            const parts = s.split(/[\/\-]/);

            if (parts.length === 3) {

                const y = parseInt(parts[0], 10);

                const m = parseInt(parts[1], 10) - 1;

                const day = parseInt(parts[2], 10);

                const dt = new Date(y, m, day);

                if (!isNaN(dt.getTime())) return dt;

            }

            return new Date();

        };



        const evaluateMathExpression = (expr, fallback = 0) => {

            if (expr === null || expr === undefined || expr === '') return fallback;

            if (typeof expr === 'number') return (isNaN(expr) || !isFinite(expr)) ? fallback : expr;

            let s = String(expr).trim();

            if (!s) return fallback;

            // 徹底淨化：移除常見貨幣符號、中文「元」、千分位逗號與空白
            s = s.replace(/[,，]/g, '').replace(/[$NTnt元\s]/g, '').trim();

            if (!s) return fallback;

            if (/^-?\d+(\.\d+)?$/.test(s)) {

                const val = parseFloat(s);

                return (isNaN(val) || !isFinite(val)) ? fallback : val;

            }

            if (!/^[\d\.\+\-\*\/\(\)\s]+$/.test(s)) {

                return fallback;

            }

            try {

                let clean = s.replace(/[\+\-\*\/]+$/, '').trim();

                if (!clean) return fallback;

                const openCount = (clean.match(/\(/g) || []).length;

                const closeCount = (clean.match(/\)/g) || []).length;

                if (openCount > closeCount) {

                    clean += ')'.repeat(openCount - closeCount);

                }

                const fn = new Function(`'use strict'; return (${clean});`);

                const res = fn();

                if (typeof res === 'number' && !isNaN(res) && isFinite(res)) {

                    return Math.round(res * 100) / 100;

                }

                return fallback;

            } catch (e) {

                return fallback;

            }

        };

        // 全局安全數值轉換器：保證永遠回傳有限數值，杜絕 NaN / 非數值滲透
        const cleanNumber = (val, fallback = 0) => {
            if (val === null || val === undefined || val === '') return fallback;
            if (typeof val === 'number') return (isNaN(val) || !isFinite(val)) ? fallback : val;
            const res = evaluateMathExpression(val, fallback);
            return (typeof res === 'number' && !isNaN(res) && isFinite(res)) ? res : fallback;
        };



        const normalizeItems = (items) => {
            if (!items) return [];
            if (Array.isArray(items)) return items.filter(Boolean);
            if (typeof items === 'string') {
                const trimmed = items.trim();
                if (!trimmed) return [];
                if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
                    try {
                        const parsed = JSON.parse(trimmed);
                        if (Array.isArray(parsed)) return parsed.filter(Boolean);
                        if (parsed && typeof parsed === 'object') return Object.values(parsed).filter(Boolean);
                    } catch (e) {}
                }
                return trimmed.split(/[;｜\|\n\r]+/).filter(Boolean).map((name, idx) => {
                    let cleanName = name.replace(/^•\s*/, '').replace(/^[✅🔄⬜]+(已到貨|處理中|待料中)?\s*/, '').trim();
                    let qty = 1;
                    const qtyMatch = cleanName.match(/\[數量:\s*(\d+)\]/);
                    if (qtyMatch) {
                        qty = parseInt(qtyMatch[1], 10);
                        cleanName = cleanName.replace(/\[數量:\s*\d+\]/, '').trim();
                    }
                    cleanName = cleanName.replace(/👨‍🔧技師:.+/, '').trim();

                    return {
                        id: Date.now() + idx,
                        name: cleanName || name,
                        partsPrice: 0,
                        laborHours: 0,
                        qty: qty,
                        itemStatus: name.indexOf('✅') >= 0 ? 'fulfilled' : (name.indexOf('🔄') >= 0 ? 'processing' : 'pending'),
                        fulfilled: name.indexOf('✅') >= 0,
                        mechanics: {}
                    };
                });
            }
            if (typeof items === 'object') {
                try {
                    return Object.values(items).filter(Boolean);
                } catch (e) {
                    return [];
                }
            }
            return [];
        };

        const buildHumanItemsStr = (items, fallbackHumanItems = '') => {
            const validItems = Array.isArray(items)
                ? items.filter(i => i && ((typeof i === 'string' && i.trim() !== '') || (typeof i === 'object' && (i.name || i.desc))))
                : [];
            if (validItems.length === 0) {
                return (fallbackHumanItems && typeof fallbackHumanItems === 'string') ? fallbackHumanItems : '';
            }
            return validItems.map(i => {
                if (typeof i === 'string') return i.trim();
                const st = getItemStatus(i);
                const stTag = st === 'fulfilled' ? '✅已到貨' : (st === 'processing' ? '🔄處理中' : '⬜待料中');
                const mech = Object.keys(i.mechanics || {}).filter(k => i.mechanics[k]).join('、');
                let text = `${stTag} ${i.name || i.desc} [數量:${i.qty || 1}]`;
                if (mech) text += ` 👨‍🔧技師:${mech}`;
                return text;
            }).join(' ｜ ');
        };

        const normalizeRecord = (r, fallbackIdx = 0) => {

            if (!r || typeof r !== 'object') return r;

            // ★ 確保每一筆歷史工單都有唯一且穩定的 ID，防止 6~10 月舊工單因缺 ID 或重複 ID 被覆蓋消失
            const safeId = (r.id && String(r.id).trim() !== '' && String(r.id) !== 'undefined')
                ? String(r.id).trim()
                : `HIST_${r.monthStr || 'REC'}_${r.date || 'NODATE'}_${r.plate || 'NOPLATE'}_${r.total || 0}_${fallbackIdx}`;

            // ★ 修正 JS 空陣列 [] Truthy 陷阱：明確檢查有效品項長度，若 items 無內容則自動由 human_items 還原
            const fromItems = normalizeItems(r.items).filter(i => i && ((typeof i === 'string' && i.trim() !== '') || (i.name && String(i.name).trim() !== '')));
            const fromHuman = normalizeItems(r.human_items).filter(i => i && ((typeof i === 'string' && i.trim() !== '') || (i.name && String(i.name).trim() !== '')));
            const items = fromItems.length > 0 ? fromItems : fromHuman;
            const human_items = buildHumanItemsStr(items, r.human_items);

            const total = cleanNumber(r.total, 0);
            const depositAmount = cleanNumber(r.depositAmount, 0);
            const remainingBalance = cleanNumber(r.remainingBalance, Math.max(0, total - depositAmount));

            // ★ 修正歷史工單無 status 欄位時被誤判為「維修處理中」的問題
            let normalizedStatus = r.status;
            if (normalizedStatus === '已完工' || normalizedStatus === 'completed' || r.isCompleted === true) {
                normalizedStatus = 'completed';
            } else if (normalizedStatus === 'in_progress' || normalizedStatus === '維修中') {
                // 若已有歷史月份標籤或完工日且非明確在修階段，歸為已完工
                if ((r.monthStr || r.completedDate) && r.progressStage !== '等待備料' && r.progressStage !== '維修中' && r.progressStage !== '完工待交車') {
                    normalizedStatus = 'completed';
                } else {
                    normalizedStatus = 'in_progress';
                }
            } else if (!normalizedStatus || String(normalizedStatus).trim() === '') {
                if (r.progressStage === '等待備料' || r.progressStage === '維修中' || r.progressStage === '完工待交車') {
                    normalizedStatus = 'in_progress';
                } else {
                    normalizedStatus = 'completed';
                }
            }

                ? '已完工'

        const compressImage = (file) => {

            return new Promise((resolve) => {

                const reader = new FileReader();

                reader.readAsDataURL(file);

                reader.onload = (event) => {

                    const img = new Image();

                    img.src = event.target.result;

                    img.onload = () => {

                        const canvas = document.createElement('canvas');

                        const MAX_WIDTH = 800;

                        const MAX_HEIGHT = 600;

                        let width = img.width;

                        let height = img.height;



                        if (width > height) {

                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }

                        } else {

                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }

                        }



                        canvas.width = width;

                        canvas.height = height;

                        const ctx = canvas.getContext('2d');

                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', 0.5));

                    };

                    img.onerror = () => resolve(null);

                };

                reader.onerror = () => resolve(null);

            });

        };



        const copyToClipboard = (text, onSuccess, onFail) => {

            const textArea = document.createElement("textarea");

            textArea.value = text;

            textArea.style.position = "fixed";

            textArea.style.opacity = "0";

            document.body.appendChild(textArea);

            textArea.focus();

            textArea.select();

            try {

                const successful = document.execCommand('copy');

                if (successful && onSuccess) onSuccess();

                else if (!successful && onFail) onFail();

            } catch (err) {

                if (onFail) onFail();

            }

            document.body.removeChild(textArea);

        };



        const exportToCsv = (filename, rows) => {

                str = str.replace(/"/g, '""');

                if (str.search(/("|,|\n)/g) >= 0) str = `"${str}"`;

                return str;

            }).join(",");

            const csvContent = "\uFEFF" + rows.map(processRow).join("\r\n");

            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });

            const link = document.createElement("a");

            const url = URL.createObjectURL(blob);

            link.setAttribute("href", url);

            link.setAttribute("download", filename);

            link.style.visibility = 'hidden';

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

        const safeFetchGAS = async (url, payload, timeoutMs = 30000) => {
            if (!url || !String(url).trim().startsWith('https://script.google.com/')) {
                return { ok: false, error: '無效的 Google Apps Script 網址格式（須以 https://script.google.com/ 開頭）' };
            }
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(String(url).trim(), {
                    method: 'POST',
                    mode: 'cors',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                clearTimeout(id);
                if (!res.ok) throw new Error(`HTTP 狀態碼錯誤: ${res.status}`);
                const text = await res.text();
                try {
                    const data = JSON.parse(text);
                    return { ok: true, data };
                } catch (jsonErr) {
                    if (text.includes('<!DOCTYPE html>') || text.includes('<html')) {
                        return { ok: false, error: 'Google 伺服器回傳了網頁而非 JSON 資料。請確認 Apps Script 部署時：\n1. 已點擊「管理部署 ➜ 編輯 ➜ 建立新版本」\n2. 「誰可以存取」已設為「所有人 (Anyone)」' };
                    }
                    return { ok: false, error: '伺服器回應非有效 JSON: ' + text.slice(0, 120) };
                }
            } catch (err) {
                clearTimeout(id);
                return { ok: false, error: err.name === 'AbortError' ? '連線逾時（Google 試算表回應超過 30 秒，請再試一次）' : `網路或跨域連線中斷 (${err.message})` };

        };

            const addItem = () => { updateDraft('items', [...draftOrder.items, { id: Date.now(), name: '', partsPrice: 0, laborHours: 0, qty: 1, subtotal: 0, itemStatus: 'pending', fulfilled: false, mechanics: {}, isBasicMaintenance: true }]); };

            const removeItem = (id) => { if (draftOrder.items.length > 1) updateDraft('items', draftOrder.items.filter(i => i.id !== id)); };

            const updateItem = (id, field, value) => {
                setDraftOrder(prev => ({
                    ...prev,
                    items: prev.items.map(i => {
                        if (i.id === id) {
                            const qty = Math.max(1, Number(field === 'qty' ? value : (i.qty || 1)));
                            const laborHoursNum = evaluateMathExpression(field === 'laborHours' ? value : i.laborHours, 0);
                            const partsPriceNum = evaluateMathExpression(field === 'partsPrice' ? value : i.partsPrice, 0);

                            // 手動編輯小計輸入框時，即時記錄輸入字串
                            if (field === 'subtotal') {
                                return { ...i, subtotal: value };
                            }

                            // 當技師修改零件費、工時或數量時：小計 = (零件費 + 工時工資) * 數量
                            if (field === 'partsPrice' || field === 'laborHours' || field === 'qty') {
                                const newAutoSubtotal = Math.round((partsPriceNum + (laborHoursNum * hourlyRate)) * qty);
                                return {
                                    ...i,
                                    [field]: value,
                                    subtotal: newAutoSubtotal
                                };
                            }

                            return { ...i, [field]: value };
                        }
                        return i;
                    })
                }));
            };

            // 手動更改小計失焦 (onBlur) 或 Enter 時：在工時不變的情況下，自動由小計扣除工資反推算出零件費
            const handleSubtotalBlur = (item, rawVal) => {
                const valStr = String(rawVal !== undefined && rawVal !== null ? rawVal : '').trim();
                const qty = Math.max(1, Number(item.qty || 1));
                const laborHoursNum = evaluateMathExpression(item.laborHours, 0);
                const laborFeePerUnit = laborHoursNum * hourlyRate;
                const autoSub = Math.round((evaluateMathExpression(item.partsPrice, 0) + laborFeePerUnit) * qty);

                if (valStr === '') {
                    // 若清空小計，還原為標準公式計算
                    updateDraft('items', draftOrder.items.map(i => i.id === item.id ? { ...i, subtotal: autoSub } : i));
                    return;
                }

                const evaluatedSubtotal = evaluateMathExpression(valStr, autoSub);
                // 小計 = 工時工資 + 零件費。在工時不變的情況下，扣除工時工資得出單件零件費
                const deducedPartsPrice = Math.max(0, Math.round((evaluatedSubtotal / qty) - laborFeePerUnit));

                updateDraft('items', draftOrder.items.map(i => {
                    if (i.id === item.id) {
                        return {
                            ...i,
                            subtotal: evaluatedSubtotal,
                            partsPrice: deducedPartsPrice
                        };
                    }
                    return i;
                }));
            };

            const toggleItemMechanic = (id, staffName) => {

                updateDraft('items', draftOrder.items.map(i => {

                    if (i.id === id) return { ...i, mechanics: { ...i.mechanics, [staffName]: !i.mechanics[staffName] } };

                    return i;

                }));

            };



            const handleToggleCommission = (item) => {

                const cur = item.isBasicMaintenance !== undefined ? item.isBasicMaintenance : true;

                if (cur) {

                    // 目前為「免抽成」，欲切換為「計抽成」

                    if (isUnlocked) {

                        // 老闆模式：直接切換，無需重複輸入密碼

                        updateItem(item.id, 'isBasicMaintenance', false);

                    } else {

                        // 員工模式：需輸入主管授權 PIN 碼驗證一次，通過後即進入老闆模式

                        requestAdminAuth(() => {

                            updateItem(item.id, 'isBasicMaintenance', false);

                        });

                    }

                } else {

                    // 目前為「計抽成」，切換回「免抽成」可直接變更

                    updateItem(item.id, 'isBasicMaintenance', true);

                }

            };



            const handleToggleCommissionParts = (checked) => {

                if (checked) {

                    if (isUnlocked) {

                        // 老闆模式：直接開啟，不重複輸入

                        updateDraft('commissionParts', true);

                    } else {

                        // 員工模式：需主管授權 PIN 碼

                        requestAdminAuth(() => {

                            updateDraft('commissionParts', true);

                        });

                    }

                } else {

                    updateDraft('commissionParts', false);

                }

            };



            const commissionRate = Number(shopInfo.referrerCommissionRate !== undefined ? shopInfo.referrerCommissionRate : 20);

            const getItemTotal = (item) => {
                if (item.subtotal !== undefined && item.subtotal !== null && item.subtotal !== '') {
                    return evaluateMathExpression(item.subtotal, 0);
                }
                return (evaluateMathExpression(item.partsPrice, 0) + (evaluateMathExpression(item.laborHours, 0) * hourlyRate)) * Number(item.qty || 1);
            };

            const total = draftOrder.items.reduce((sum, item) => sum + getItemTotal(item), 0);

            const totalPartsFee = draftOrder.items.reduce((sum, item) => sum + (evaluateMathExpression(item.partsPrice, 0) * Number(item.qty || 1)), 0);



            const eligiblePartsFee = draftOrder.items.reduce((sum, item) => {

                const isBasic = item.isBasicMaintenance !== undefined ? item.isBasicMaintenance : true;

                if (isBasic) return sum;

                const pFee = evaluateMathExpression(item.partsPrice, 0);
                if (pFee > 0) return sum + (pFee * Number(item.qty || 1));
                if (item.subtotal !== undefined && item.subtotal !== null && item.subtotal !== '' && Number(item.laborHours || 0) === 0) {
                    return sum + evaluateMathExpression(item.subtotal, 0);
                }
                return sum + pFee;

            }, 0);

            const basicMaintenancePartsFee = totalPartsFee - eligiblePartsFee;

            const referrerPartsCommission = (draftOrder.referrerStaff && draftOrder.commissionParts) ? Math.round(eligiblePartsFee * (commissionRate / 100)) : 0;

            const depositAmount = draftOrder.hasDeposit ? Math.min(total, evaluateMathExpression(draftOrder.depositAmount, 0)) : 0;

            const remainingBalance = Math.max(0, total - depositAmount);



            const handleSaveAction = (targetStatus, stageOverride = null) => {

                if (!draftOrder.plate) return showAlert('請輸入車牌號碼');

                    laborHours: evaluateMathExpression(it.laborHours, 0),

                    subtotal: it.subtotal !== undefined && it.subtotal !== null && it.subtotal !== '' ? evaluateMathExpression(it.subtotal, 0) : undefined,

                    isBasicMaintenance: it.isBasicMaintenance !== undefined ? it.isBasicMaintenance : true

                }));

                const orderPayload = {

                    ...draftOrder,

                    items: evaluatedItems,

                    hourlyRate,

                    plate: String(draftOrder.plate).toUpperCase(),

                    total,

                    depositAmount,

                    remainingBalance,

                    referrerStaff: draftOrder.referrerStaff || '',

                    commissionParts: Boolean(draftOrder.commissionParts),

                    referrerCommissionRate: commissionRate,

                    eligiblePartsFee,

                    referrerPartsCommission,

                    depositDate: (draftOrder.hasDeposit && !draftOrder.depositDate) ? todayStr : draftOrder.depositDate,

                    status: targetStatus,

                    progressStage: finalStage,

                    completedDate: targetStatus === 'completed' ? (draftOrder.completedDate || todayStr) : '',

                    isCompleted: targetStatus === 'completed'

                handleCreateOrder(orderPayload, editingOrderId);

            const quickAdd = (service) => {

                            return { ...prev, items: newItems };

        };



        const Dashboard = ({ records, deleteRecord, setSelectedRecord, setShowReceiptModal, setDraftOrder, setEditingOrderId, setView, handleStatusChange, handleUpdateOrderStage, handleUpdateOrderField, showConfirm, isUnlocked, requestAdminAuth }) => {

            const [endYear, setEndYear] = useState(currentYear);

                return (records || []).filter(r => r && r.status === 'in_progress' && r.progressStage === '等待備料').filter(r => {

                    if (!searchTerm) return true;

                    const q = String(searchTerm).trim().toUpperCase();

                    const plateStr = r.plate ? String(r.plate).toUpperCase() : '';

                    const nameStr = r.name ? String(r.name).toUpperCase() : '';

                    const phoneStr = r.phone ? String(r.phone) : '';

                    return plateStr.includes(q) || nameStr.includes(q) || phoneStr.includes(q);

                });

            }, [records, searchTerm]);



            const inProgressRecords = useMemo(() => {

                return (records || []).filter(r => r && r.status === 'in_progress' && r.progressStage !== '等待備料').filter(r => {

                    if (inProgressFilter !== 'all' && r.progressStage !== inProgressFilter) return false;

                    if (!searchTerm) return true;

                    const q = String(searchTerm).trim().toUpperCase();

                    const plateStr = r.plate ? String(r.plate).toUpperCase() : '';

                    const nameStr = r.name ? String(r.name).toUpperCase() : '';

                    const phoneStr = r.phone ? String(r.phone) : '';

                    return plateStr.includes(q) || nameStr.includes(q) || phoneStr.includes(q);

                });

            }, [records, searchTerm, inProgressFilter]);



            const { filteredCompletedRecords, totalCompletedRevenue, cashRevenue, transferRevenue, avgOrderPrice } = useMemo(() => {

                const startYm = startYear * 100 + Number(startMonth);

                const endYm = endYear * 100 + Number(endMonth);



                const filtered = (records || []).filter(r => r && r.status === 'completed').filter(r => {

                    // 優先檢查所屬月份標籤 (monthStr，如 "2026-06")，確保 6~10 月分頁資料 100% 精準命中
                    let recYm = null;
                    if (r.monthStr && /^\d{4}-\d{1,2}$/.test(String(r.monthStr).trim())) {
                        const parts = String(r.monthStr).trim().split('-');
                        recYm = parseInt(parts[0], 10) * 100 + parseInt(parts[1], 10);
                    } else {
                        const dObj = parseDateSafe(r.completedDate || r.date || r.timestamp);
                        recYm = dObj.getFullYear() * 100 + (dObj.getMonth() + 1);
                    }

                    const inRange = recYm >= startYm && recYm <= endYm;

                    if (!inRange) return false;

                    if (!searchTerm) return true;

                    const q = String(searchTerm).trim().toUpperCase();

                    const plateStr = r.plate ? String(r.plate).toUpperCase() : '';

                    const nameStr = r.name ? String(r.name).toUpperCase() : '';

                    const phoneStr = r.phone ? String(r.phone) : '';

                    return plateStr.includes(q) || nameStr.includes(q) || phoneStr.includes(q);

                });



                let totalRev = 0;

                let cashRev = 0;

                let transRev = 0;



                filtered.forEach(r => {

                    const tot = cleanNumber(r.total, 0);

                    totalRev += tot;

                    if (r.paymentMethod === '現金') cashRev += tot;

                    else if (r.paymentMethod === '匯款') transRev += tot;

                });



                const avg = filtered.length > 0 ? Math.round(totalRev / filtered.length) : 0;



                return {

                    filteredCompletedRecords: filtered,

                    totalCompletedRevenue: totalRev,

                    cashRevenue: cashRev,

                    transferRevenue: transRev,

                    avgOrderPrice: avg

                };

            }, [records, startYear, startMonth, endYear, endMonth, searchTerm]);



            const handleQuickRange = (rangeType) => {

                const now = new Date();

                const cy = now.getFullYear();

                const cm = now.getMonth() + 1;

                if (rangeType === 'thisYear') {

                    setStartYear(cy); setStartMonth(1);

                    setEndYear(cy); setEndMonth(12);

                } else if (rangeType === 'last3Months') {

                    const past = new Date(now.getFullYear(), now.getMonth() - 2, 1);

                    setStartYear(past.getFullYear()); setStartMonth(past.getMonth() + 1);

                    setEndYear(cy); setEndMonth(cm);

                } else if (rangeType === 'last6Months') {

                    const past = new Date(now.getFullYear(), now.getMonth() - 5, 1);

                    setStartYear(past.getFullYear()); setStartMonth(past.getMonth() + 1);

                    setEndYear(cy); setEndMonth(cm);

                } else if (rangeType === 'all') {

                    setStartYear(2023); setStartMonth(1);

                    setEndYear(cy + 1); setEndMonth(12);

                }

                                                                <span className={`flex-1 truncate ${isFulfilled ? 'line-through text-slate-400' : 'font-bold text-slate-700'}`}>

                                            <div className="border-t border-slate-100 pt-3 flex gap-1.5">
                                                <button

                                                    title="列印此車輛備料品項明細單"

                                                <button

                let parsedPhone = quoteCustomer.phone || '';

                let parsedBike = quoteCustomer.bikeModel || '';



                const plateMatch = text.match(/\b([A-Z0-9]{2,4}[- ][A-Z0-9]{2,4}|[A-Z]{1,3}\d{3,4}|\d{3,4}[A-Z]{1,3})\b/i);

                if (plateMatch) parsedPlate = plateMatch[0].toUpperCase().replace(/\s+/g, '-');



                const phoneMatch = text.match(/(09\d{2}[- ]?\d{3}[- ]?\d{3}|09\d{8})/);

                if (phoneMatch) parsedPhone = phoneMatch[0].replace(/[- ]/g, '');



                const nameMatch = text.match(/(?:車主|客戶|姓名|名字|稱呼|聯絡人)[：:\s]*([^\s,，\n\r]{2,5})/i) ||

                                  text.match(/([^\s,，\n\r]{1,4})(?:先生|小姐|哥|姐|大哥)/);

                if (nameMatch) parsedName = nameMatch[1].trim();



                const bikeMatch = text.match(/(?:車種|車型|型號)[：:\s]*([^\s,，\n\r]+)/i) ||

                                  text.match(/(勁戰[\d代]*|SMAX|FORCE[\s\d]*|DRG[\s\d]*|MMBCU|KRV|AUGUR|JET[\sSLSR+]*|CYGNUS|JOG|MANY|BWS|R15|MT-?\d+|CB\d+|雷霆[\sS]*|新勁戰)/i);

                    const systemInstruction = `你是一位專業機車行技術店長與維修估價顧問。

請仔細研讀車主或技師的對話紀錄、LINE 訊息或便條，深入理解語意脈絡，精確提取客戶與維修資訊。



門市標準庫存與工時參考表：

${JSON.stringify(catalogSummary)}



分析與判斷規則：

1. 車牌識別：標準台灣車牌格式 (例如 ABC-1234, 123-ABC, 1234-AB 等)。

2. 車主與車種識別：若出現稱呼（如陳先生、林哥）或特定車種名稱（勁戰、DRG、MMBCU、SMAX 等）請提取。

3. 施工項目與費用：

   - 若對話中出現算式（如 "150*2" 或 "300+150"），請計算後輸出最終零件單價 (partsPrice)。

   - 若項目吻合門市標準備料，請採用標準零件費與工時。

   - 若文中未提及金額，請根據一般機車行情推估合理的零件費 (partsPrice) 與標準工時 (laborHours，例如 0.15、0.25、0.5 等)。

4. 必須嚴格輸出符合指定 JSON Schema 的結構化資料。`;



                    const payload = {

                                    items: {

                                        type: "ARRAY",

                                        items: {

                                            type: "OBJECT",

                                            properties: {

                                                name: { type: "STRING", description: "維修/保養/更換項目名稱" },

                                                partsPrice: { type: "NUMBER", description: "零件費用 (純數字)" },

                                                laborHours: { type: "NUMBER", description: "預估工時 (以小時為單位，如 0.2 或 0.5)" },

                                                qty: { type: "NUMBER", description: "數量 (整數，預設 1)" }

                                            },

                                        }

                                    }

                                },

                            }

                    // 具備指數退避重試的 Fetch 調用

                    const fetchWithBackoff = async (url, opts, retries = 3) => {

                        let delay = 1000;

                                const resp = await fetch(url, opts);

                                if (resp.status === 429 || (resp.status >= 500 && resp.status < 600)) {

                                    if (i === retries - 1) return resp;

                                    await new Promise(r => setTimeout(r, delay));

                                    delay *= 2;

                                }

                                await new Promise(r => setTimeout(r, delay));

                                delay *= 2;

                            }

                        saveToLocalSafe('moto_shopInfo', updatedShop);

                        saveToLocalSafe('moto_customLogo', compressed);

                        // 上傳後立即將新 Logo 寫入雲端試算表，防止被背景輪詢覆蓋回預設圖示
                        saveSettingsToCloud(null, true, null, null, null, null, null, null, updatedShop);

                        showAlert('✅ 店鋪專屬 Logo 已更新並自動永久同步至雲端！');

                    }

                }

            };



            const handleResetLogo = () => {

                showConfirm('確定要將店鋪 Logo 還原為系統預設圖示嗎？', () => {

                    const resetShop = { ...shopInfo, logo: DEFAULT_LOGO };

                    setShopInfo(resetShop);

                    saveToLocalSafe('moto_shopInfo', resetShop);

                    localStorage.removeItem('moto_customLogo');

                    saveSettingsToCloud(null, true, null, null, null, null, null, null, resetShop);

                });

            };



            const handleAddStaff = () => {

                const trimmed = newStaffName.trim();

                if (!trimmed) return showAlert('請輸入技師姓名');

                if (staffList.includes(trimmed)) return showAlert('此技師已在名單中');

                const preset = STAFF_ROLE_PRESETS[newStaffRole] || STAFF_ROLE_PRESETS['技師'];

                const updatedList = [...staffList, trimmed];

                const updatedProfiles = {

                    ...(staffProfiles || {}),

                    [trimmed]: {

                        role: newStaffRole,

                        years: 1,

                        baseSalary: preset.defaultSalary,

                        laborBonusRate: preset.baseLaborRate + 1,

                        referralBonusRate: preset.baseReferralRate + 0.5

                    }

                };

                setStaffList(updatedList);

                setStaffProfiles(updatedProfiles);

                setNewStaffName('');

                saveSettingsToCloud(null, true, null, updatedProfiles, updatedList);

                showAlert(`✅ 已新增技師【${trimmed} (${preset.title})】並自動同步雲端！`);

            };



            const handleUpdateStaffRoleInSettings = (name, newRole) => {

                const preset = STAFF_ROLE_PRESETS[newRole] || STAFF_ROLE_PRESETS['技師'];

                const curProf = (staffProfiles && staffProfiles[name]) || DEFAULT_STAFF_PROFILES[name] || { years: 1 };

                const years = Number(curProf.years !== undefined ? curProf.years : 1);

                const seniorityLabor = Math.min(years * 1, 10);

                const seniorityRef = Math.min(years * 0.5, 5);

                const updatedProfiles = {

                    ...(staffProfiles || {}),

                    [name]: {

                        ...curProf,

                        role: newRole,

                        years,

                        baseSalary: preset.defaultSalary,

                        laborBonusRate: preset.baseLaborRate + seniorityLabor,

                        referralBonusRate: preset.baseReferralRate + seniorityRef

                    }

                };

                setStaffProfiles(updatedProfiles);

                saveSettingsToCloud(null, true, null, updatedProfiles, staffList);

            };



            const handleRemoveStaff = (name) => {

                showConfirm(`確定要從團隊名單中移除「${name}」嗎？`, () => {

                    const updatedList = staffList.filter(s => s !== name);

                    setStaffList(updatedList);

                    saveSettingsToCloud(null, true, null, null, updatedList);

                });

            };



            const handleAddService = () => {

                if (!newService.name.trim()) return showAlert('請輸入維修項目名稱');

                const item = {

                    id: String(Date.now()),

                    name: newService.name.trim(),

                    partsPrice: cleanNumber(newService.partsPrice, 0),

                    laborHours: cleanNumber(newService.laborHours, 0.1),

                    stock: cleanNumber(newService.stock, 10),

                    minStock: cleanNumber(newService.minStock, 5),

                    supplier: newService.supplier.trim() || '一般材料商',

                    isBasicMaintenance: Boolean(newService.isBasicMaintenance)

                };

                setQuickServices([...quickServices, item]);

                setNewService({ name: '', partsPrice: '', laborHours: 0.15, stock: 10, minStock: 5, supplier: '', isBasicMaintenance: true });

            };



            const handleUpdateServiceField = (id, field, value) => {

                setQuickServices(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));

            };



            const handleResetDefaultServices = () => {

                showConfirm('確定要載入預設常用標準備料項目嗎？（將會保留您已新增的自訂項目，並補齊預設項目）', () => {

                    const existNames = new Set(quickServices.map(s => s.name));

                    const merged = [...quickServices];

                    DEFAULT_SERVICES.forEach(ds => {

                        if (!existNames.has(ds.name)) merged.push({ ...ds, id: String(Date.now() + Math.random()) });

                    });

                    setQuickServices(merged);

                    showAlert('✅ 已補齊預設常用保養備料項目！');

                });

            };



            const handleDownloadJsonBackup = () => {

                const backupObj = {

                    version: '3.0.0',

                    exportDate: new Date().toISOString(),

                    shopInfo,

                    quickServices,

                    staffList,

                    staffProfiles,

                    records,

                    customers,

                    cashRecords,

                    adminPin: currentPin

                };

                const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });

                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');

                a.href = url;

                a.download = `SourceMoto_Backup_${getLocalDateString(new Date())}.json`;

                a.click();

            };



            const handleExportAllRecordsCsv = () => {

                const rows = [

                    ['工單編號', '建檔日期', '完工日期', '車牌號碼', '客戶姓名', '聯絡電話', '車種型號', '里程(km)', '狀態', '進度階段', '維修保養內容', '已付定金', '待收尾款', '總金額', '付款方式', '介紹人技師', '備註事項']

                ];

                (records || []).forEach(r => {

                    const items = normalizeItems(r.items);

                    const itemsStr = items.map(it => `${it.name} x${it.qty || 1}`).join('；');

                    rows.push([

                        r.id || '',

                        formatDate(r.date),

                        r.completedDate || '',

                        r.plate || '',

                        r.name || '',

                        r.phone || '',

                        r.bikeModel || '',

                        r.mileage || '',

                        r.status === 'completed' ? '已完工' : '處理中',

                        r.progressStage || '',

                        itemsStr || r.human_items || '',

                        cleanNumber(r.depositAmount, 0),

                        cleanNumber(r.remainingBalance, 0),

                        cleanNumber(r.total, 0),

                        r.paymentMethod || '現金',

                        r.referrerStaff || '',

                        r.notes || ''

                    ]);

                });

                exportToCsv(`全店維修工單總表_${getLocalDateString(new Date())}.csv`, rows);

            };



            const handleExportAllCustomersCsv = () => {

                    ['客戶編號', '車牌號碼', '車主姓名', '聯絡電話', '電子郵件', '車種型號', '出廠年份', '最新里程(km)', '最後來店日']

                ];

                (customers || []).forEach(c => {

                    rows.push([

                        c.id || '',

                        c.plate || '',

                        c.name || '',

                        c.phone || '',

                        c.email || '',

                        c.bikeModel || '',

                        c.year || '',

                        c.lastMileage || '',

                        formatDate(c.lastVisit)

                    ]);

                });

                exportToCsv(`全店客戶車籍名冊_${getLocalDateString(new Date())}.csv`, rows);

            };



            const handleRestoreJsonBackup = (e) => {

                const file = e.target.files && e.target.files[0];

                    try {

                            if (Array.isArray(parsed.quickServices)) setQuickServices(parsed.quickServices);

                            if (Array.isArray(parsed.staffList)) setStaffList(parsed.staffList);

                            if (parsed.staffProfiles) setStaffProfiles(parsed.staffProfiles);

                            if (Array.isArray(parsed.records)) setRecords(parsed.records.map(normalizeRecord));

                            if (Array.isArray(parsed.customers)) setCustomers(parsed.customers);

                            if (Array.isArray(parsed.cashRecords)) setCashRecords(parsed.cashRecords);

                            if (parsed.adminPin) setCurrentPin(String(parsed.adminPin));

                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">

                                    <div>

                                        <label className="font-black text-slate-800 text-sm flex items-center gap-1.5">

                                            <Cloud size={18} className="text-blue-600"/> Google Apps Script 雲端同步網址 (/exec)

                                        </label>

                                        <p className="text-[11px] text-slate-500 mt-0.5">貼上部署後的 Web App 網址並點選「儲存並測試雲端連線」即可綁定試算表</p>

                                    <button

                                        type="button"

                                        onClick={() => {

                                            setUrl(DEFAULT_GAS_URL);

                                        還原預設同步網址

                                        className="flex-1 p-2.5 border border-slate-300 rounded-xl font-mono text-xs bg-white outline-none focus:border-blue-500"

                                    />

                                    <button 

                                        type="button" 

                                        onClick={() => testConnection(tempUrl)} 

                                        disabled={isLoading}

                                        className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 shrink-0 shadow-xs"

                                    >

                                        {isLoading ? <RefreshCw size={14} className="animate-spin"/> : <CloudCheck size={15}/>}

                                        <span>儲存並測試雲端連線</span>

                                    </button>

                                        <AlertTriangle size={15} className="text-amber-600 shrink-0"/>

                                        <span>您已修改輸入框中的網址，請務必點擊右側「儲存並測試雲端連線」才會正式套用生效！</span>

                                    </div>

                                )}



                                <div className="text-[11px] text-slate-500 flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-200/80">

                                    <span className="font-mono truncate max-w-xl">目前生效網址：{gasUrl || '未設定'}</span>

                                    <span className="text-emerald-700 font-bold">目前載入：{records.length} 筆工單 / {customers.length} 位客戶</span>

                                </div>

                            </div>



                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">

                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">

                                    <label className="font-bold text-slate-800 text-sm flex items-center gap-1.5">

                                        <Lock size={16} className="text-amber-600"/> 主管授權 4 位數 PIN 碼

                                        />

                                        <button type="button" onClick={() => setShowPinText(!showPinText)} className="px-3 py-2 bg-white border border-slate-300 hover:bg-slate-100 rounded-xl font-bold text-slate-600">

                                            {showPinText ? '隱藏' : '顯示'}

                                        </button>

                                        <button

                                            onClick={() => {

                                                localStorage.setItem('moto_adminPin', newPin);

                                                saveSettingsToCloud(null, false, newPin);

                                            className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold shadow-xs"

                                        >

                                            更新並同步密碼

                                        </button>

                                    <label className="font-bold text-slate-800 text-sm flex items-center gap-1.5">

                                    </label>

                                    <p className="text-[11px] text-slate-500">用於「雲端報價 & 備料」中的 LINE 對話智慧解析（留空則使用系統預設環境或本機解析）</p>

                                    <div className="flex gap-2 pt-1">

                                        <input 

                                            type={showApiKey ? "text" : "password"}

                                            {showApiKey ? '隱藏' : '顯示'}

                                        </button>

                                    </div>

                                    <button

                                        onClick={() => logoInputRef.current && logoInputRef.current.click()}

                                        className="flex-1 sm:flex-none px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold flex items-center justify-center gap-1.5 shadow-xs"

                                    >

                                        <Camera size={15}/> 上傳新 Logo

                                    </button>

                                    <button

                                        className="px-3 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-600 rounded-xl font-bold"

                                    </button>

                                <div>

                                    <label className="font-bold text-slate-600 block mb-1">車行名稱</label>

                                    <input type="text" value={shopInfo.name || ''} onChange={e => setShopInfo({ ...shopInfo, name: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-xl font-bold outline-none focus:border-blue-500"/>

                                </div>

                                <div>

                                    <label className="font-bold text-slate-600 block mb-1">聯絡電話</label>

                                    <input type="text" value={shopInfo.phone || ''} onChange={e => setShopInfo({ ...shopInfo, phone: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-xl font-bold outline-none focus:border-blue-500"/>

                                <div>

                                    <label className="font-bold text-slate-600 block mb-1">門市地址</label>

                                <div>

                                    <label className="font-bold text-slate-600 block mb-1">統一編號</label>

                                    <span className="text-[10px] text-indigo-600 mt-1 block">勾選提撥零件抽成時的預設計算百分比（基礎保養耗材自動免抽成）</span>

                                </div>

                                <div className="sm:col-span-2">

                                </div>

        const CustomersView = ({ customers, setCustomers, records, setRecords, saveSettingsToCloud, showAlert, showConfirm }) => {

            const [searchTerm, setSearchTerm] = useState('');

            const [selectedCustomer, setSelectedCustomer] = useState(null);

            const [editingCustomer, setEditingCustomer] = useState(null);

            const [editForm, setEditForm] = useState({

                id: '',

                plate: '',

                name: '',

                phone: '',

                email: '',

                year: '',

                bikeModel: '',

                lastMileage: ''

            });



            const filtered = (customers || []).filter(c => {

                if (!c) return false;

                if (!searchTerm) return true;

                const q = String(searchTerm).trim().toUpperCase();

                const plateStr = c.plate ? String(c.plate).toUpperCase() : '';

                const nameStr = c.name ? String(c.name).toUpperCase() : '';

                const phoneStr = c.phone ? String(c.phone) : '';

                return plateStr.includes(q) || nameStr.includes(q) || phoneStr.includes(q);

            });

            const handleOpenEdit = (c) => {
                setEditingCustomer(c);
                setEditForm({
                    id: c.id ? String(c.id) : String(Date.now()),
                    plate: String(c.plate || ''),
                    name: String(c.name || ''),
                    phone: String(c.phone !== undefined && c.phone !== null ? c.phone : ''),
                    email: String(c.email || ''),
                    year: String(c.year !== undefined && c.year !== null ? c.year : ''),
                    bikeModel: String(c.bikeModel || ''),
                    lastMileage: c.lastMileage !== undefined && c.lastMileage !== null ? String(c.lastMileage) : ''
                });
            };

            const handleSaveCustomer = () => {
                const targetPlate = String(editForm.plate || '').trim().toUpperCase();
                if (!targetPlate) {
                    return showAlert('車牌號碼不可為空！');
                }

                const originalPlate = String(editingCustomer.plate || '').trim().toUpperCase();
                const editingId = editingCustomer.id ? String(editingCustomer.id) : null;

                // 健全的比對判定：ID 一致（轉字串比較）或原車牌號碼一致皆視為同一位客戶
                const isCurrentCustomer = (c) => {
                    if (!c) return false;
                    if (editingId && c.id && String(c.id) === editingId) return true;
                    if (originalPlate && String(c.plate || '').trim().toUpperCase() === originalPlate) return true;
                    return false;
                };

                // 檢查是否與其他既有客戶車牌衝突
                const isDuplicate = customers.some(c => {
                    if (isCurrentCustomer(c)) return false;
                    return String(c.plate || '').trim().toUpperCase() === targetPlate;
                });

                if (isDuplicate) {
                    return showAlert(`車牌號碼「${targetPlate}」已被其他車主登記，請確認是否輸入錯誤！`);
                }

                const safeName = String(editForm.name || '').trim();
                const safePhone = String(editForm.phone || '').trim();
                const safeEmail = String(editForm.email || '').trim();
                const safeYear = String(editForm.year || '').trim();
                const safeBikeModel = String(editForm.bikeModel || '').trim();
                const safeLastMileage = editForm.lastMileage !== '' && editForm.lastMileage !== null && editForm.lastMileage !== undefined 
                    ? Number(editForm.lastMileage) 
                    : editingCustomer.lastMileage;

                const updatedCustomerObj = {
                    ...editingCustomer,
                    id: editingCustomer.id || editForm.id || String(Date.now()),
                    plate: targetPlate,
                    name: safeName,
                    phone: safePhone,
                    email: safeEmail,
                    year: safeYear,
                    bikeModel: safeBikeModel,
                    lastMileage: safeLastMileage
                };

                let matchFound = false;
                const updatedCustomers = customers.map(c => {
                    if (isCurrentCustomer(c)) {
                        matchFound = true;
                        return updatedCustomerObj;
                    }
                    return c;
                });

                // 防呆：若因故未匹配到陣列元素，則追加此筆資料
                const finalCustomers = matchFound ? updatedCustomers : [...customers, updatedCustomerObj];

                setCustomers(finalCustomers);
                saveToLocalSafe('moto_customers', finalCustomers);

                // 若車牌有異動，連動更新所有歷史工單的車牌號碼，避免歷史履歷孤立
                let updatedRecords = records;
                if (originalPlate && originalPlate !== targetPlate && setRecords) {
                    updatedRecords = records.map(r => {
                        if (String(r.plate || '').trim().toUpperCase() === originalPlate) {
                            return {
                                ...r,
                                plate: targetPlate,
                                name: safeName || r.name,
                                phone: safePhone || r.phone,
                                email: safeEmail || r.email,
                                bikeModel: safeBikeModel || r.bikeModel
                            };
                        }
                        return r;
                    });
                    setRecords(updatedRecords);
                    saveToLocalSafe('moto_records', updatedRecords);
                }

                // 同步雲端試算表：顯式傳入 finalCustomers 與 updatedRecords，徹底杜絕閉包舊狀態覆蓋問題
                if (saveSettingsToCloud) {
                    saveSettingsToCloud(null, true, null, null, null, null, finalCustomers, updatedRecords);
                }

                setEditingCustomer(null);
                showAlert(`✅ 客戶【${targetPlate}】車籍資料已成功更新${originalPlate !== targetPlate ? '，並已連動更新歷史工單紀錄！' : '！'}`);
            };

            const handleDeleteCustomer = () => {
                const originalPlate = String(editingCustomer.plate || '').trim().toUpperCase();
                const editingId = editingCustomer.id ? String(editingCustomer.id) : null;
                const isCurrentCustomer = (c) => {
                    if (!c) return false;
                    if (editingId && c.id && String(c.id) === editingId) return true;
                    if (originalPlate && String(c.plate || '').trim().toUpperCase() === originalPlate) return true;
                    return false;
                };

                showConfirm(`確定要從資料庫中刪除【${editingCustomer.plate} - ${editingCustomer.name || '車主'}】的車籍檔案嗎？`, () => {
                    const updated = customers.filter(c => !isCurrentCustomer(c));
                    setCustomers(updated);
                    saveToLocalSafe('moto_customers', updated);
                    if (saveSettingsToCloud) {
                        saveSettingsToCloud(null, true, null, null, null, null, updated);
                    }
                    setEditingCustomer(null);
                    showAlert(`已刪除客戶【${editingCustomer.plate}】檔案。`);

                            </h2>

                        <table className="w-full text-left text-xs min-w-[700px]">

                            <thead>

        const WorkforceView = ({ records, staffList, shopInfo, staffProfiles, setStaffProfiles, isUnlocked, requestAdminAuth, showAlert, gasUrl, saveSettingsToCloud, isSavingSettings }) => {
            const currentYear = new Date().getFullYear();
            const currentMonth = new Date().getMonth();
            const [selectedYear, setSelectedYear] = useState(currentYear);
            const [selectedMonth, setSelectedMonth] = useState(currentMonth);
            const [isSyncingCloud, setIsSyncingCloud] = useState(false);
            const [showGasModal, setShowGasModal] = useState(false);

            // 自動存檔輕量 Toast 浮動狀態
            const [toastMsg, setToastMsg] = useState(null);
            const toastTimerRef = useRef(null);
            const showToast = (msg) => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToastMsg(msg);
                toastTimerRef.current = setTimeout(() => {
                    setToastMsg(null);
                }, 3200);
            };

            // 編輯技師職級與薪酬彈窗狀態
            const [editingStaffName, setEditingStaffName] = useState(null);
            const [editForm, setEditForm] = useState({
                role: '技師',
                years: 1,
                baseSalary: 35000,
                laborBonusRate: 20,
                referralBonusRate: 15
            });

            // 取得技師完整設定檔（含五階預設值與年資加成回退）
            const getStaffProfile = (name) => {
                const profile = (staffProfiles && staffProfiles[name]) || DEFAULT_STAFF_PROFILES[name] || {};
                const role = profile.role || '技師';
                const preset = STAFF_ROLE_PRESETS[role] || STAFF_ROLE_PRESETS['技師'];
                const years = Number(profile.years !== undefined ? profile.years : 1);
                const baseSalary = Number(profile.baseSalary !== undefined ? profile.baseSalary : preset.defaultSalary);
                
                // 年資自動加成：年資每滿 1 年，工資產值提撥率 +1%、介紹人零件抽成率 +0.5% (上限分別為 +10% 與 +5%)
                const seniorityLaborBonus = Math.min(years * 1, 10);
                const seniorityRefBonus = Math.min(years * 0.5, 5);

                const laborBonusRate = Number(profile.laborBonusRate !== undefined ? profile.laborBonusRate : (preset.baseLaborRate + seniorityLaborBonus));
                const referralBonusRate = Number(profile.referralBonusRate !== undefined ? profile.referralBonusRate : (preset.baseReferralRate + seniorityRefBonus));

                return {
                    name,
                    role,
                    years,
                    baseSalary,
                    laborBonusRate,
                    referralBonusRate,
                    preset,
                    seniorityLaborBonus,
                    seniorityRefBonus
                };
            };

            const staffStats = useMemo(() => {
                const stats = {};
                staffList.forEach(name => {
                    const prof = getStaffProfile(name);
                    stats[name] = { 
                        name,
                        role: prof.role,
                        years: prof.years,
                        profile: prof,
                        tasks: 0, 
                        totalHours: 0, 
                        laborRevenue: 0, 
                        laborBonusRate: prof.laborBonusRate,
                        laborBonus: 0, 
                        referralCases: 0, 
                        referralRevenue: 0,
                        referralBonusRate: prof.referralBonusRate,
                        referralCommission: 0, 
                        baseSalary: prof.baseSalary,
                        totalSalary: prof.baseSalary 
                    };
                });

                records.filter(r => r.status === 'completed').forEach(r => {
                    const d = parseDateSafe(r.timestamp || r.date);
                    if (d.getFullYear() === selectedYear && d.getMonth() === selectedMonth) {
                        const items = normalizeItems(r.items);
                        const hourly = Number(r.hourlyRate || shopInfo.hourlyRate || 800);

                        // 計算工時產值與技術工資提撥（依該技師年資職級提撥率）
                        items.forEach(it => {
                            const mechanics = Object.keys(it.mechanics || {}).filter(k => it.mechanics[k]);
                            if (mechanics.length > 0) {
                                const hours = evaluateMathExpression(it.laborHours, 0) * Number(it.qty || 1);
                                const rev = hours * hourly;
                                mechanics.forEach(m => {
                                    if (stats[m]) {
                                        const prof = stats[m].profile;
                                        const laborRateDecimal = (prof.laborBonusRate || 20) / 100;
                                        const allocatedRev = rev / mechanics.length;
                                        const allocatedHours = hours / mechanics.length;
                                        const allocatedBonus = allocatedRev * laborRateDecimal;

                                        stats[m].tasks += 1;
                                        stats[m].totalHours += allocatedHours;
                                        stats[m].laborRevenue += allocatedRev;
                                        stats[m].laborBonus += allocatedBonus;
                                    }
                                });
                            }
                        });

                        // 計算介紹人業務零件抽成（依該介紹技師年資職級抽成率）
                        if (r.referrerStaff && stats[r.referrerStaff] && r.commissionParts) {
                            const prof = stats[r.referrerStaff].profile;
                            const eligibleParts = Number(r.eligiblePartsFee || 0);
                            const refRateDecimal = (prof.referralBonusRate || 15) / 100;
                            const refCommission = Math.round(eligibleParts * refRateDecimal);

                            stats[r.referrerStaff].referralCases += 1;
                            stats[r.referrerStaff].referralRevenue += eligibleParts;
                            stats[r.referrerStaff].referralCommission += refCommission;
                        }
                    }
                });

                // 總薪資計算 = 基礎底薪 + 技術工資獎金 + 零件業務抽成
                Object.keys(stats).forEach(k => {
                    const s = stats[k];
                    s.laborBonus = Math.round(s.laborBonus);
                    s.laborRevenue = Math.round(s.laborRevenue);
                    s.totalBonus = Math.round(s.laborBonus + s.referralCommission);
                    s.totalSalary = Math.round(s.baseSalary + s.totalBonus);
                });

                return stats;
            }, [records, staffList, selectedYear, selectedMonth, shopInfo, staffProfiles]);

            // 彙總全店人事數據
            const aggregateStats = useMemo(() => {
                let totalBase = 0;
                let totalLaborBonus = 0;
                let totalRefCommission = 0;
                let grandTotalPayroll = 0;
                let totalTasks = 0;
                let totalHours = 0;

                Object.values(staffStats).forEach(s => {
                    totalBase += s.baseSalary;
                    totalLaborBonus += s.laborBonus;
                    totalRefCommission += s.referralCommission;
                    grandTotalPayroll += s.totalSalary;
                    totalTasks += s.tasks;
                    totalHours += s.totalHours;
                });

                return {

        const CashierView = ({ records, cashRecords, setCashRecords, showAlert, showConfirm, saveSettingsToCloud, isCloudEnabled, isSavingSettings }) => {

            const todayStr = getLocalDateString(new Date());

            const [targetDate, setTargetDate] = useState(todayStr);



            const [startingCash, setStartingCash] = useState('');

            const [incomes, setIncomes] = useState([]);

            const [incDesc, setIncDesc] = useState('');

            const [incAmount, setIncAmount] = useState('');
